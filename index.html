<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦵 旅行足跡檔案</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-primary: #080e14;
            --bg-secondary: #0d1520;
            --bg-card: #111c28;
            --bg-card-hover: #162232;
            --text-primary: #f0f4f8;
            --text-secondary: #6b7c8f;
            --text-muted: #4a5568;
            --accent: #10b981;
            --accent-soft: rgba(16,185,129,0.12);
            --accent-glow: rgba(16,185,129,0.25);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px var(--accent-glow);
            --radius: 20px;
            --radius-sm: 12px;
        }
        
        [data-theme="light"] {
            --bg-primary: #f0f2f5;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8f9fa;
            --text-primary: #1a2432;
            --text-secondary: #5a6577;
            --text-muted: #9aa5b4;
            --border: rgba(0,0,0,0.06);
            --border-hover: rgba(0,0,0,0.1);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.5;
        }
        
        /* Layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 72px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }
        
        .sidebar-logo {
            font-size: 28px;
            margin-bottom: 28px;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }
        
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            padding: 0 10px;
        }
        
        .nav-item {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-secondary);
            background: transparent;
            border: none;
            position: relative;
        }
        
        .nav-item:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--accent), #059669);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }
        
        .nav-item-label {
            font-size: 9px;
            margin-top: 3px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        
        .nav-item-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .sidebar-spacer { flex: 1; }
        
        .sidebar-theme {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .sidebar-theme:hover { border-color: var(--accent); }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 72px;
            padding: 28px 32px;
            max-width: 1100px;
        }
        
        /* Page */
        .page { display: none; }
        .page.active { display: block; }
        
        /* Header */
        .page-header {
            margin-bottom: 28px;
        }
        
        .page-header h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        
        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Filter Box */
        .filter-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .filter-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-select {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            min-width: 140px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .filter-select:hover { border-color: var(--accent); }
        
        .filter-select option { background: var(--bg-card); }
        
        .filter-search {
            flex: 1;
            min-width: 200px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .filter-search:focus { border-color: var(--accent); }
        .filter-search::placeholder { color: var(--text-muted); }
        
        /* Trip Cards */
        .trip-list {
            display: grid;
            gap: 16px;
        }
        
        .trip-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .trip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }
        
        .trip-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .trip-card:hover::before { opacity: 1; }
        
        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .trip-info { flex: 1; }
        
        .trip-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .trip-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .trip-date, .trip-location {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .trip-location-badge {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .trip-stats {
            display: flex;
            gap: 20px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        
        .trip-stat {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .trip-stat-icon {
            font-size: 18px;
            opacity: 0.7;
        }
        
        .trip-stat-value {
            font-size: 15px;
            font-weight: 600;
        }
        
        .trip-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        /* Trip Detail */
        .trip-detail {
            display: none;
        }
        
        .trip-detail.active {
            display: block;
        }
        
        .detail-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .back-btn:hover { border-color: var(--accent); }
        
        .detail-title {
            font-size: 24px;
            font-weight: 700;
        }
        
        .detail-meta {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px;
            text-align: center;
        }
        
        .stat-icon { font-size: 26px; margin-bottom: 8px; }
        .stat-value { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Expense Section */
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .expense-list {
            margin-bottom: 24px;
        }
        
        .expense-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        
        .expense-item:hover { border-color: var(--border-hover); }
        
        .expense-left { display: flex; align-items: center; gap: 14px; }
        
        .expense-icon {
            width: 46px;
            height: 46px;
            background: var(--bg-secondary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        
        .expense-info .name { font-size: 15px; font-weight: 500; }
        .expense-info .meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        
        .expense-amount {
            font-size: 17px;
            font-weight: 700;
            color: #f87171;
        }
        
        /* Charts */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 18px;
        }
        
        .chart-card-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 14px;
        }
        
        .chart-container { height: 220px; position: relative; }
        
        /* Map */
        .map-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }
        
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .map-title { font-size: 16px; font-weight: 600; }
        
        .map-toggle {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .map-toggle:hover { filter: brightness(1.1); }
        
        #map {
            height: 350px;
            border-radius: var(--radius-sm);
            z-index: 1;
        }
        
        /* Place List */
        .place-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .place-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .place-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .place-name { font-size: 14px; font-weight: 500; }
        .place-time { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        
        /* Settings */
        .settings-group {
            margin-bottom: 28px;
        }
        
        .settings-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .settings-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .settings-item:hover { border-color: var(--border-hover); }
        
        .settings-item-left { display: flex; align-items: center; gap: 14px; }
        .settings-item-icon { font-size: 22px; }
        .settings-item-label { font-size: 15px; }
        .settings-item-desc { font-size: 12px; color: var(--text-secondary); }
        
        /* Toggle */
        .toggle {
            width: 50px;
            height: 30px;
            background: var(--bg-secondary);
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: background 0.25s;
        }
        
        .toggle.active { background: var(--accent); }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .toggle.active::after { transform: translateX(20px); }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-state-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state-text { font-size: 15px; }
        
        /* Mobile Nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 8px 12px;
            z-index: 100;
        }
        
        .mobile-nav-inner {
            display: flex;
            justify-content: space-around;
        }
        
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 8px 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            transition: all 0.2s;
            border: none;
            background: none;
        }
        
        .mobile-nav-item.active { color: var(--accent); }
        .mobile-nav-item-icon { font-size: 22px; }
        
        /* Leaflet Dark Theme */
        .leaflet-popup-content-wrapper { background: var(--bg-card) !important; color: var(--text-primary) !important; border-radius: 14px !important; border: 1px solid var(--border) !important; }
        .leaflet-popup-tip { background: var(--bg-card) !important; }
        .leaflet-popup-content { margin: 14px 16px !important; }
        .leaflet-popup-content b { font-size: 14px; }
        .leaflet-popup-content span { font-size: 12px; color: var(--text-secondary); }
        .leaflet-control-zoom a { background: var(--bg-card) !important; color: var(--text-primary) !important; border-color: var(--border) !important; }
        .leaflet-control-zoom a:hover { background: var(--bg-card-hover) !important; }
        .leaflet-control-attribution { background: rgba(8,14,20,0.8) !important; color: var(--text-muted) !important; font-size: 10px; }
        .leaflet-control-attribution a { color: var(--text-secondary) !important; }
        
        /* Custom Map Markers */
        .custom-marker {
            background: none !important;
            border: none !important;
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 20px 16px; padding-bottom: 100px; }
            .mobile-nav { display: block; }
            .page-header h1 { font-size: 26px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-value { font-size: 20px; }
            .trip-stats { gap: 12px; }
            .place-list { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 480px) {
            .filter-row { flex-direction: column; }
            .filter-select, .filter-search { width: 100%; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .trip-card { padding: 18px 16px; }
            .trip-title { font-size: 16px; }
            #map { height: 250px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">🦵</div>
            <div class="sidebar-nav">
                <button class="nav-item active" data-page="home">
                    <div class="nav-item-wrap">
                        <span>🏠</span>
                        <span class="nav-item-label">首頁</span>
                    </div>
                </button>
                <button class="nav-item" data-page="map">
                    <div class="nav-item-wrap">
                        <span>🗺️</span>
                        <span class="nav-item-label">地圖</span>
                    </div>
                </button>
                <button class="nav-item" data-page="stats">
                    <div class="nav-item-wrap">
                        <span>📊</span>
                        <span class="nav-item-label">統計</span>
                    </div>
                </button>
                <button class="nav-item" data-page="settings">
                    <div class="nav-item-wrap">
                        <span>⚙️</span>
                        <span class="nav-item-label">設定</span>
                    </div>
                </button>
            </div>
            <div class="sidebar-spacer"></div>
            <button class="sidebar-theme" id="themeToggle">🌙</button>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Home Page -->
            <div class="page active" id="page-home">
                <div class="page-header">
                    <h1>🦵 旅行足跡</h1>
                    <p>記錄你的每一段旅程</p>
                </div>
                
                <!-- Filter Box -->
                <div class="filter-box">
                    <div class="filter-row">
                        <select class="filter-select" id="filterCountry">
                            <option value="">🏷️ 全部國家</option>
                            <option value="china">🇨🇳 中國</option>
                            <option value="hongkong">🇭🇰 香港</option>
                            <option value="macau">🇲🇴 澳門</option>
                            <option value="taiwan">🇹🇼 台灣</option>
                            <option value="japan">🇯🇵 日本</option>
                            <option value="korea">🇰🇷 韓國</option>
                            <option value="australia">🇦🇺 澳洲</option>
                        </select>
                        <select class="filter-select" id="filterYear">
                            <option value="">📅 全部年份</option>
                            <option value="2026">2026年</option>
                            <option value="2025">2025年</option>
                            <option value="2024">2024年</option>
                        </select>
                        <input type="text" class="filter-search" id="filterSearch" placeholder="🔍 搜尋旅程...">
                    </div>
                </div>
                
                <!-- Trip List -->
                <div class="trip-list" id="tripList"></div>
            </div>
            
            <!-- Trip Detail -->
            <div class="trip-detail" id="tripDetail">
                <div class="detail-header">
                    <button class="back-btn" id="backBtn">←</button>
                    <div>
                        <div class="detail-title" id="detailTitle"></div>
                        <div class="detail-meta" id="detailMeta"></div>
                    </div>
                </div>
                
                <!-- Stats Grid -->
                <div class="stats-grid" id="statsGrid"></div>
                
                <!-- Map -->
                <div class="map-container">
                    <div class="map-header">
                        <div class="map-title">🗺️ 足跡地圖</div>
                        <button class="map-toggle" id="mapToggle">展開</button>
                    </div>
                    <div id="mapWrapper" style="display:none;">
                        <div id="map"></div>
                    </div>
                </div>
                
                <!-- Places -->
                <div class="section-title">📍 行程地點</div>
                <div class="place-list" id="placeList"></div>
                
                <!-- Charts -->
                <div class="chart-grid">
                    <div class="chart-card">
                        <div class="chart-card-title">📊 消費分佈</div>
                        <div class="chart-container">
                            <canvas id="detailPieChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-card-title">📈 金額比較</div>
                        <div class="chart-container">
                            <canvas id="detailBarChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- Expense List -->
                <div class="section-title">💸 消費記錄</div>
                <div class="expense-list" id="expenseList"></div>
            </div>
            
            <!-- Map Page -->
            <div class="page" id="page-map">
                <div class="page-header">
                    <h1>🗺️ 足跡地圖</h1>
                    <p>你走過的地方</p>
                </div>
                <div class="map-container">
                    <div id="fullMap" style="height: 500px;"></div>
                </div>
            </div>
            
            <!-- Stats Page -->
            <div class="page" id="page-stats">
                <div class="page-header">
                    <h1>📊 消費統計</h1>
                    <p>分析你的消費習慣</p>
                </div>
                <div class="chart-grid">
                    <div class="chart-card">
                        <div class="chart-card-title">📊 消費分佈</div>
                        <div class="chart-container">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-card-title">📈 類別比較</div>
                        <div class="chart-container">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Settings Page -->
            <div class="page" id="page-settings">
                <div class="page-header">
                    <h1>⚙️ 設定</h1>
                    <p>自訂你的旅行檔案</p>
                </div>
                
                <div class="settings-group">
                    <div class="settings-title">外觀</div>
                    <div class="settings-item">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">🌙</span>
                            <div>
                                <div class="settings-item-label">深色模式</div>
                                <div class="settings-item-desc">開啟深色主題</div>
                            </div>
                        </div>
                        <div class="toggle active" id="darkModeToggle"></div>
                    </div>
                </div>
                
                <div class="settings-group">
                    <div class="settings-title">數據</div>
                    <div class="settings-item" id="exportBtn">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">📤</span>
                            <div>
                                <div class="settings-item-label">匯出數據</div>
                                <div class="settings-item-desc">下載你的旅行記錄</div>
                            </div>
                        </div>
                        <span>→</span>
                    </div>
                    <div class="settings-item" id="importBtn">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">📥</span>
                            <div>
                                <div class="settings-item-label">匯入數據</div>
                                <div class="settings-item-desc">從備份恢復</div>
                            </div>
                        </div>
                        <span>→</span>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Mobile Nav -->
        <nav class="mobile-nav">
            <div class="mobile-nav-inner">
                <button class="mobile-nav-item active" data-page="home">
                    <span class="mobile-nav-item-icon">🏠</span>
                    <span>首頁</span>
                </button>
                <button class="mobile-nav-item" data-page="map">
                    <span class="mobile-nav-item-icon">🗺️</span>
                    <span>地圖</span>
                </button>
                <button class="mobile-nav-item" data-page="stats">
                    <span class="mobile-nav-item-icon">📊</span>
                    <span>統計</span>
                </button>
                <button class="mobile-nav-item" data-page="settings">
                    <span class="mobile-nav-item-icon">⚙️</span>
                    <span>設定</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        // Default trip data
        const defaultTrips = [
            {
                id: 1,
                name: '深圳灣一日遊',
                date: '2026-06-07',
                location: '🇨🇳 深圳',
                country: 'china',
                places: [
                    { name: '深圳灣口岸', lat: 22.4709, lng: 113.9295, type: 'transport', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', lat: 22.4938, lng: 113.9304, type: 'leisure', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', lat: 22.4855, lng: 113.9412, type: 'food', icon: '🍽️', time: '15:52' },
                    { name: '蔡潤越南粉', lat: 22.5012, lng: 113.9283, type: 'food', icon: '🍽️', time: '20:13' }
                ],
                expenses: [
                    { name: 'ZAKC直通車（去程）', amount: 60.00, category: '交通', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', amount: 231.48, category: '休閒', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', amount: 231.48, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'NEED創意韓國料理（加單）', amount: 37.22, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'ZAKC直通車（回程）', amount: 60.00, category: '交通', icon: '🚌', time: '16:49' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '蔡潤越南粉', amount: 147.73, category: '餐飲', icon: '🍽️', time: '20:13' }
                ]
            }
        ];

        let trips = JSON.parse(localStorage.getItem('travelTrips')) || JSON.parse(JSON.stringify(defaultTrips));
        let currentTrip = null;
        let fullMap = null;
        let tripMap = null;
        let pieChart, barChart, detailPieChart, detailBarChart;
        
        // Country flags
        const countryFlags = {
            'china': { flag: '🇨🇳', name: '中國' },
            'hongkong': { flag: '🇭🇰', name: '香港' },
            'macau': { flag: '🇲🇴', name: '澳門' },
            'taiwan': { flag: '🇹🇼', name: '台灣' },
            'japan': { flag: '🇯🇵', name: '日本' },
            'korea': { flag: '🇰🇷', name: '韓國' },
            'australia': { flag: '🇦🇺', name: '澳洲' },
            'usa': { flag: '🇺🇸', name: '美國' }
        };
        
        const typeColors = {
            transport: '#3b82f6',
            food: '#f97316',
            leisure: '#10b981',
            shopping: '#8b5cf6'
        };
        
        const typeLabels = {
            transport: '交通',
            food: '餐飲',
            leisure: '休閒',
            shopping: '購物'
        };

        // Theme
        function setTheme(dark) {
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').textContent = '☀️';
                document.getElementById('darkModeToggle').classList.add('active');
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('themeToggle').textContent = '🌙';
                document.getElementById('darkModeToggle').classList.remove('active');
            }
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            
            // Re-init maps with correct tiles
            if (fullMap) {
                fullMap.remove();
                initFullMap();
            }
            if (tripMap) {
                tripMap.remove();
                tripMap = null;
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            setTheme(!document.documentElement.hasAttribute('data-theme'));
        });

        document.getElementById('darkModeToggle').addEventListener('click', () => {
            setTheme(!document.documentElement.hasAttribute('data-theme'));
        });

        if (localStorage.getItem('theme') === 'light') {
            setTheme(false);
        } else {
            setTheme(true);
        }

        // Navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll(`[data-page="${pageId}"]`).forEach(n => n.classList.add('active'));
            
            // Hide trip detail when leaving home
            if (pageId !== 'home' || !currentTrip) {
                document.getElementById('tripDetail').classList.remove('active');
                document.getElementById('page-home').classList.add('active');
            }
            
            if (pageId === 'map' && fullMap) {
                setTimeout(() => fullMap.invalidateSize(), 100);
            }
        }

        document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(btn => {
            btn.addEventListener('click', () => showPage(btn.dataset.page));
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            currentTrip = null;
            document.getElementById('tripDetail').classList.remove('active');
            renderTripList();
        });

        // Filter
        function applyFilters() {
            const country = document.getElementById('filterCountry').value;
            const year = document.getElementById('filterYear').value;
            const search = document.getElementById('filterSearch').value.toLowerCase();
            
            let filtered = trips;
            
            if (country) {
                filtered = filtered.filter(t => t.country === country);
            }
            
            if (year) {
                filtered = filtered.filter(t => t.date.startsWith(year));
            }
            
            if (search) {
                filtered = filtered.filter(t => 
                    t.name.toLowerCase().includes(search) || 
                    t.location.toLowerCase().includes(search)
                );
            }
            
            renderTripList(filtered);
        }

        document.getElementById('filterCountry').addEventListener('change', applyFilters);
        document.getElementById('filterYear').addEventListener('change', applyFilters);
        document.getElementById('filterSearch').addEventListener('input', applyFilters);

        // Trip List
        function renderTripList(tripData = trips) {
            const container = document.getElementById('tripList');
            
            if (tripData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🦵</div>
                        <div class="empty-state-text">沒有找到旅程記錄</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = tripData.map(trip => {
                const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
                return `
                    <div class="trip-card" data-id="${trip.id}">
                        <div class="trip-header">
                            <div class="trip-info">
                                <div class="trip-title">${trip.name}</div>
                                <div class="trip-meta">
                                    <span class="trip-date">📅 ${trip.date}</span>
                                </div>
                            </div>
                            <div class="trip-location-badge">${trip.location}</div>
                        </div>
                        <div class="trip-stats">
                            <div class="trip-stat">
                                <span class="trip-stat-icon">💰</span>
                                <span class="trip-stat-value">$${total.toFixed(0)}</span>
                                <span class="trip-stat-label">消費</span>
                            </div>
                            <div class="trip-stat">
                                <span class="trip-stat-icon">📍</span>
                                <span class="trip-stat-value">${trip.places.length}</span>
                                <span class="trip-stat-label">地點</span>
                            </div>
                            <div class="trip-stat">
                                <span class="trip-stat-icon">🧾</span>
                                <span class="trip-stat-value">${trip.expenses.length}</span>
                                <span class="trip-stat-label">消費記錄</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Click handler
            container.querySelectorAll('.trip-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    showTripDetail(id);
                });
            });
        }

        // Trip Detail
        function showTripDetail(id) {
            const trip = trips.find(t => t.id === id);
            if (!trip) return;
            
            currentTrip = trip;
            
            document.getElementById('detailTitle').textContent = trip.name;
            document.getElementById('detailMeta').textContent = `${trip.date} · ${trip.location}`;
            
            // Stats
            const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
            const categories = {};
            trip.expenses.forEach(e => {
                categories[e.category] = (categories[e.category] || 0) + e.amount;
            });
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-value">$${total.toFixed(0)}</div>
                    <div class="stat-label">總消費</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📍</div>
                    <div class="stat-value">${trip.places.length}</div>
                    <div class="stat-label">地點</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🧾</div>
                    <div class="stat-value">${trip.expenses.length}</div>
                    <div class="stat-label">記錄</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🍽️</div>
                    <div class="stat-value">${Object.keys(categories).length}</div>
                    <div class="stat-label">類別</div>
                </div>
            `;
            
            // Places
            document.getElementById('placeList').innerHTML = trip.places.map(p => `
                <div class="place-item">
                    <div class="place-icon">${p.icon}</div>
                    <div>
                        <div class="place-name">${p.name}</div>
                        <div class="place-time">🕐 ${p.time} · ${typeLabels[p.type] || p.type}</div>
                    </div>
                </div>
            `).join('');
            
            // Expenses
            document.getElementById('expenseList').innerHTML = trip.expenses.map(exp => `
                <div class="expense-item">
                    <div class="expense-left">
                        <div class="expense-icon">${exp.icon}</div>
                        <div class="expense-info">
                            <div class="name">${exp.name}</div>
                            <div class="meta">${exp.category} · ${exp.time}</div>
                        </div>
                    </div>
                    <div class="expense-amount">−$${exp.amount.toFixed(2)}</div>
                </div>
            `).join('');
            
            // Charts
            renderDetailCharts(trip);
            
            // Show detail view
            document.getElementById('tripDetail').classList.add('active');
            document.getElementById('page-home').classList.remove('active');
            
            // Init map after showing
            setTimeout(() => initTripMap(trip), 100);
        }

        // Map toggle
        document.getElementById('mapToggle').addEventListener('click', function() {
            const wrapper = document.getElementById('mapWrapper');
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                this.textContent = '收合';
                if (tripMap) setTimeout(() => tripMap.invalidateSize(), 100);
            } else {
                wrapper.style.display = 'none';
                this.textContent = '展開';
            }
        });

        function initTripMap(trip) {
            if (tripMap) {
                tripMap.remove();
                tripMap = null;
            }
            
            if (trip.places.length === 0) return;
            
            tripMap = L.map('map').setView([trip.places[0].lat, trip.places[0].lng], 13);
            
            const isDark = document.documentElement.hasAttribute('data-theme');
            const tileUrl = isDark 
                ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            
            L.tileLayer(tileUrl, {
                attribution: '© OpenStreetMap © CARTO',
                maxZoom: 19
            }).addTo(tripMap);
            
            trip.places.forEach(place => {
                const color = typeColors[place.type] || '#64748b';
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background:${color};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px ${color}66;font-size:16px;">${place.icon}</div>`,
                    iconSize: [36, 36],
                    iconAnchor: [18, 18]
                });
                
                L.marker([place.lat, place.lng], { icon })
                    .bindPopup(`<b>${place.name}</b><br><span>${place.icon} ${typeLabels[place.type]}</span><br><span>🕐 ${place.time}</span>`)
                    .addTo(tripMap);
            });
            
            const group = L.featureGroup(trip.places.map(p => L.marker([p.lat, p.lng])));
            tripMap.fitBounds(group.getBounds().pad(0.3));
        }

        function initFullMap() {
            if (!fullMap) {
                fullMap = L.map('fullMap').setView([22.5, 114], 10);
                
                const isDark = document.documentElement.hasAttribute('data-theme');
                const tileUrl = isDark 
                    ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                    : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
                
                L.tileLayer(tileUrl, {
                    attribution: '© OpenStreetMap © CARTO',
                    maxZoom: 19
                }).addTo(fullMap);
            }
            
            // Clear existing markers
            fullMap.eachLayer(layer => {
                if (layer instanceof L.Marker) {
                    fullMap.removeLayer(layer);
                }
            });
            
            // Add markers for all places
            trips.forEach(trip => {
                trip.places.forEach(place => {
                    const color = typeColors[place.type] || '#64748b';
                    const icon = L.divIcon({
                        className: 'custom-marker',
                        html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px ${color}66;font-size:14px;">${place.icon}</div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });
                    
                    L.marker([place.lat, place.lng], { icon })
                        .bindPopup(`<b>${place.name}</b><br><span>${trip.name}</span><br><span>${place.icon} ${typeLabels[place.type]}</span>`)
                        .addTo(fullMap);
                });
            });
        }

        // Charts
        function renderDetailCharts(trip) {
            const totals = { '交通': 0, '餐飲': 0, '休閒': 0, '購物': 0 };
            trip.expenses.forEach(exp => {
                if (totals[exp.category] !== undefined) {
                    totals[exp.category] += exp.amount;
                }
            });
            
            const labels = Object.keys(totals).filter(k => totals[k] > 0);
            const data = labels.map(l => totals[l]);
            const colors = labels.map(l => {
                if (l === '交通') return '#3b82f6';
                if (l === '餐飲') return '#f97316';
                if (l === '休閒') return '#10b981';
                return '#8b5cf6';
            });
            
            if (detailPieChart) detailPieChart.destroy();
            if (detailBarChart) detailBarChart.destroy();
            
            detailPieChart = new Chart(document.getElementById('detailPieChart'), {
                type: 'doughnut',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, cutout: '60%' }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#8899a6', font: { size: 12 }, padding: 15 } }
                    }
                }
            });
            
            detailBarChart = new Chart(document.getElementById('detailBarChart'), {
                type: 'bar',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 8, borderSkipped: false }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8899a6' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a6' } }
                    }
                }
            });
        }

        function initCharts() {
            const totals = { '交通': 0, '餐飲': 0, '休閒': 0, '購物': 0 };
            const catMap = { '交通': '交通', '餐飲': '餐飲', '休閒': '休閒', '購物': '購物' };
            
            trips.forEach(trip => {
                trip.expenses.forEach(exp => {
                    const key = catMap[exp.category] || '購物';
                    totals[key] += exp.amount;
                });
            });
            
            const labels = Object.keys(totals).filter(k => totals[k] > 0);
            const data = labels.map(l => totals[l]);
            const colors = labels.map(l => {
                if (l === '交通') return '#3b82f6';
                if (l === '餐飲') return '#f97316';
                if (l === '休閒') return '#10b981';
                return '#8b5cf6';
            });
            
            if (labels.length === 0) return;
            
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, cutout: '60%' }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#8899a6', font: { size: 12 }, padding: 15 } } }
                }
            });
            
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 8, borderSkipped: false }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#8899a6' } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a6' } }
                    }
                }
            });
        }

        // Export/Import
        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = JSON.stringify(trips, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'travel-records.json';
            a.click();
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        trips = JSON.parse(ev.target.result);
                        localStorage.setItem('travelTrips', JSON.stringify(trips));
                        init();
                    } catch (err) {
                        alert('Invalid file format');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // Init
        function init() {
            renderTripList();
            initFullMap();
            initCharts();
        }

        init();
    </script>
</body>
</html>
