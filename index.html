<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦵 旅程記錄</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-primary: #080e14;
            --bg-secondary: #0d1520;
            --bg-card: #111c28;
            --bg-card-hover: #162232;
            --text-primary: #f0f4f8;
            --text-secondary: #6b7c8f;
            --text-muted: #4a5568;
            --accent: #10b981;
            --accent-soft: rgba(16,185,129,0.12);
            --accent-glow: rgba(16,185,129,0.25);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px var(--accent-glow);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f2f5;
            --text-primary: #1a2432;
            --text-secondary: #5a6577;
            --text-muted: #9aa5b4;
            --border: rgba(0,0,0,0.08);
            --border-hover: rgba(0,0,0,0.15);
            --shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.5;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        
        .animate-fade { animation: fadeIn 0.35s ease forwards; }
        .stagger-1 { animation-delay: 0.05s; opacity: 0; }
        .stagger-2 { animation-delay: 0.1s; opacity: 0; }
        .stagger-3 { animation-delay: 0.15s; opacity: 0; }
        .stagger-4 { animation-delay: 0.2s; opacity: 0; }
        .stagger-5 { animation-delay: 0.25s; opacity: 0; }
        
        /* Layout */
        .app-layout { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 72px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }
        
        .sidebar-logo {
            font-size: 28px;
            margin-bottom: 28px;
            filter: drop-shadow(0 0 8px var(--accent-glow));
            animation: pulse 3s ease-in-out infinite;
        }
        
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            padding: 0 10px;
        }
        
        .nav-item {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            background: transparent;
            border: none;
        }
        
        .nav-item:hover {
            background: var(--border);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        
        .nav-item.active {
            background: linear-gradient(135deg, var(--accent), #059669);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }
        
        .nav-item-label { font-size: 9px; margin-top: 3px; font-weight: 600; }
        .nav-item-wrap { display: flex; flex-direction: column; align-items: center; }
        .sidebar-spacer { flex: 1; }
        
        .sidebar-theme {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        
        .sidebar-theme:hover { border-color: var(--accent); transform: rotate(15deg); }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 72px;
            padding: 28px 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: calc(100% - 72px);
            box-sizing: border-box;
        }

        @media (min-width: 1400px) {
            .main-content { max-width: 1300px; }
        }

        @media (max-width: 768px) {
            .main-content { max-width: 100%; margin-left: 0; padding: 16px 10px; padding-bottom: 90px; }
        }
        
        /* Page */
        .page { display: none; animation: fadeIn 0.3s ease forwards; }
        .page.active { display: block; }
        
        /* Header */
        .page-header { margin-bottom: 20px; }
        .page-header h1 { font-size: 26px; font-weight: 700; margin-bottom: 2px; }
        .page-header p { color: var(--text-secondary); font-size: 13px; }
        
        /* Home: Calendar Filter */
        .home-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .home-filters {
            min-width: 380px;
            flex-shrink: 0;
        }

        .home-results {
            flex: 1;
            min-width: 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .pagination-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .pagination-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .pagination-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .cal-filter-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            align-items: flex-start;
        }

        .home-calendar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            flex: 1;
        }
        
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Calendar nav buttons */
        .cal-nav-btns { display: flex; gap: 6px; }

        .cal-nav-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .cal-nav-btn:hover { background: var(--bg-hover); transform: scale(1.05); }

        /* Calendar */
        .home-calendar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day-header {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .cal-day {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border: 1px solid transparent;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 16px;
            font-weight: 500;
        }

        .cal-day:hover { border-color: var(--accent); transform: scale(1.05); }
        .cal-day.empty { background: transparent; cursor: default; }
        .cal-day.empty:hover { transform: none; }

        .cal-day.has-trip {
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        .cal-day.selected-day {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        .cal-day-number { font-size: 12px; font-weight: 500; }
        .cal-day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px; }

        /* Home: Country Filter */
        .country-filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 120px;
        }

        .country-filter-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .country-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }

        .country-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .country-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Search */
        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-icon { font-size: 16px; color: var(--text-muted); }
        
        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        
        .search-input::placeholder { color: var(--text-muted); }
        
        /* Trip Cards */
        .trip-list { display: grid; gap: 12px; }
        
        .trip-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .trip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }
        
        .trip-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .trip-card:hover::before { opacity: 1; }
        
        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .trip-info { flex: 1; }
        .trip-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .trip-date { font-size: 12px; color: var(--text-secondary); }
        .trip-location-badge {
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 16px;
            font-weight: 500;
        }
        
        .trip-stats {
            display: flex;
            gap: 14px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        
        .trip-stat { display: flex; align-items: center; gap: 5px; }
        .trip-stat-icon { font-size: 14px; opacity: 0.7; }
        .trip-stat-value { font-size: 13px; font-weight: 600; }
        .trip-stat-label { font-size: 11px; color: var(--text-secondary); }
        
        /* Trip Detail */
        .trip-detail { display: none; }
        .trip-detail.active { display: block; animation: fadeIn 0.35s ease forwards; }
        
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        
        .back-btn {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            color: var(--text-primary);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }
        
        .back-btn:hover { border-color: var(--accent); transform: scale(1.05); }
        .detail-title { font-size: 20px; font-weight: 700; }
        .detail-meta { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
            transition: all var(--transition);
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .stat-icon { font-size: 22px; margin-bottom: 4px; }
        .stat-value { font-size: 20px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        
        /* Map Container */
        .map-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 18px;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .map-title { font-size: 14px; font-weight: 600; }
        
        .map-toggle {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }
        
        .map-toggle:hover { filter: brightness(1.1); transform: scale(1.02); }
        
        #map, #fullMap {
            height: 320px;
            border-radius: var(--radius-sm);
            z-index: 1;
        }
        
        #fullMap { height: calc(100vh - 160px); min-height: 400px; }
        
        /* Places */
        .section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        
        .place-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }
        
        .place-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all var(--transition);
        }
        
        .place-item:hover { border-color: var(--border-hover); transform: scale(1.02); }
        .place-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .place-name { font-size: 12px; font-weight: 500; }
        .place-time { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
        
        /* Charts */
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
        
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
        }
        
        .chart-card-title { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; }
        .chart-container { height: 180px; position: relative; }
        
        /* Expense List */
        .expense-list { margin-bottom: 16px; }
        
        .expense-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition);
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }
        
        .expense-item:hover { border-color: var(--border-hover); transform: translateX(3px); }
        
        .expense-left { display: flex; align-items: center; gap: 10px; }
        
        .expense-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--transition);
        }
        
        .expense-item:hover .expense-icon { transform: scale(1.1); }
        .expense-info .name { font-size: 13px; font-weight: 500; }
        .expense-info .meta { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
        .expense-amount { font-size: 15px; font-weight: 700; color: #f87171; }
        
        /* Map Page */
        .map-info-bar {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .map-info-bar span { color: var(--text-primary); font-weight: 600; }

        .map-legend {
            display: flex;
            gap: 16px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .map-legend #mapPlaceCount,
        .map-legend #mapTripCount {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .legend-divider {
            width: 1px;
            height: 16px;
            background: var(--border);
        }

        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        /* Photos Page */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        
        .photo-item {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .photo-item:hover { transform: scale(1.03); box-shadow: var(--shadow); }
        .photo-placeholder { color: var(--text-muted); font-size: 42px; opacity: 0.4; }
        .photo-add { border: 2px dashed var(--border); background: transparent; }
        .photo-add:hover { border-color: var(--accent); background: var(--accent-soft); }
        .photo-add-icon { font-size: 28px; }
        
        /* Settings */
        .settings-group { margin-bottom: 20px; }
        
        .settings-title {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .settings-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all var(--transition);
        }
        
        .settings-item:hover { border-color: var(--border-hover); transform: translateX(3px); }
        .settings-item-left { display: flex; align-items: center; gap: 12px; }
        .settings-item-icon { font-size: 18px; }
        .settings-item-label { font-size: 14px; }
        .settings-item-desc { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
        
        /* Toggle */
        .toggle {
            width: 46px;
            height: 26px;
            background: var(--bg-secondary);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background var(--transition);
        }
        
        .toggle.active { background: var(--accent); }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform var(--transition);
        }
        
        .toggle.active::after { transform: translateX(20px); }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
        .empty-state-text { font-size: 13px; }
        
        /* Mobile Nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 8px 12px;
            z-index: 100;
        }
        
        .mobile-nav-inner { display: flex; justify-content: space-around; }
        
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 6px 8px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 9px;
            transition: all var(--transition);
            border: none;
            background: none;
        }
        
        .mobile-nav-item.active { color: var(--accent); }
        .mobile-nav-item-icon { font-size: 20px; }
        
        /* Leaflet Dark Theme */
        .leaflet-popup-content-wrapper { 
            background: var(--bg-card) !important; 
            color: var(--text-primary) !important; 
            border-radius: 12px !important; 
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow) !important;
        }
        .leaflet-popup-tip { background: var(--bg-card) !important; }
        .leaflet-popup-content { margin: 10px 12px !important; }
        .leaflet-popup-content b { font-size: 12px; }
        .leaflet-popup-content span { font-size: 10px; color: var(--text-secondary); }
        .leaflet-control-zoom a { 
            background: var(--bg-card) !important; 
            color: var(--text-primary) !important; 
            border-color: var(--border) !important; 
        }
        .leaflet-control-zoom a:hover { background: var(--bg-card-hover) !important; }
        .leaflet-control-attribution { 
            background: rgba(8,14,20,0.85) !important; 
            color: var(--text-muted) !important; 
            font-size: 9px; 
        }
        .leaflet-control-attribution a { color: var(--text-secondary) !important; }
        
        .custom-marker { background: none !important; border: none !important; }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 16px 10px; padding-bottom: 90px; max-width: 100%; }
            .mobile-nav { display: block; }
            .page-header h1 { font-size: 22px; }
            .home-layout { flex-direction: column; }
            .home-filters { min-width: unset; width: 100%; }
            .cal-filter-wrapper { flex-direction: column; width: 100%; }
            .country-filter { flex-direction: row; flex-wrap: wrap; min-width: unset; width: 100%; }
            .country-filter-title { width: 100%; margin-bottom: 8px; }
            .home-calendar { padding: 12px 6px; width: 100%; }
            .cal-grid { gap: 2px; }
            .cal-day { font-size: 13px; width: 100%; aspect-ratio: 1; }
            .cal-day-header { font-size: 10px; padding: 4px 0; }
            .trip-card { padding: 16px 14px; width: 100%; box-sizing: border-box; }
            .trip-title { font-size: 16px; }
            .search-box { width: 100%; }
            
            @media (max-width: 480px) {
                .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
                .stat-value { font-size: 18px; }
                .place-list { grid-template-columns: 1fr; }
                .photo-grid { grid-template-columns: repeat(3, 1fr); }
                #fullMap { height: calc(100vh - 120px); min-height: 350px; }
                .trip-card { padding: 14px 12px; }
                .trip-title { font-size: 14px; }
                #map { height: 240px; }
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">

        <!-- Main Content -->
        <main class="main-content">
            <!-- Home Page -->
            <div class="page active" id="page-home">
                <div class="page-header">
                    <h1>🦵 旅程記錄</h1>
                    <p>記錄你的每一段旅程</p>
                </div>
                
                <!-- Home Layout: Left Filters + Right Results -->
                <div class="home-layout">
                    <!-- Left: Filters -->
                    <div class="home-filters">
                        <!-- Calendar + Filter Wrapper -->
                        <div class="cal-filter-wrapper">
                            <!-- Calendar Filter -->
                            <div class="home-calendar">
                                <div class="cal-header">
                                    <div class="cal-nav-btns">

                        <!-- Search -->

                    <!-- Right: Results -->

            <!-- Trip Detail -->

                <div class="stats-grid" id="statsGrid"></div>
                
                <div class="map-container">
                    <div class="map-header">

                    <div id="mapWrapper" style="display:none;">
                        <div id="map"></div>

                <div class="section-title">📍 行程地點</div>
                <div class="place-list" id="placeList"></div>
                
                <div class="chart-grid">
                    <div class="chart-card">

                <div class="section-title">💸 消費記錄</div>

            <!-- Map Page -->
            <div class="page" id="page-map">

                <div class="map-legend" id="mapLegend">

                    <div class="legend-divider"></div>
                    <div class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span>交通</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#f97316"></span>餐飲</div>
                    <div class="legend-item"><span class="legend-dot" style="background:#10b981"></span>休閒</div>

            <!-- Photos Page -->
            <div class="page" id="page-photos">

                <div class="photo-grid" id="photoGrid">
                    <div class="photo-item photo-add" id="addPhoto">

                <div class="empty-state" id="photoEmpty">

            <!-- Settings Page -->
            <div class="page" id="page-settings">
                <div class="page-header">
                    <h1>⚙️ 設定</h1>
                    <p>自訂你的使用體驗</p>
                </div>

                <div class="settings-group">
                    <div class="settings-title">外觀</div>
                    <div class="settings-item" id="themeToggleSetting">
                        <div class="settings-item-left">
                            <span class="settings-item-icon" id="themeToggleIcon">🌙</span>
                            <div>
                                <div class="settings-item-label" id="themeToggleLabel">深色模式</div>
                                <div class="settings-item-desc">切換淺色/深色主題</div>
                            </div>
                        </div>
                        <div class="toggle"></div>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-title">數據</div>
                    <div class="settings-item" id="exportBtn">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">📤</span>

                                <div class="settings-item-label">匯出數據</div>
                                <div class="settings-item-desc">下載你的旅行記錄</div>
                            </div>
                        </div>
                        <span>→</span>
                    </div>
                    <div class="settings-item" id="importBtn">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">📥</span>
                            <div>
                                <div class="settings-item-label">匯入數據</div>
                                <div class="settings-item-desc">從備份恢復</div>
                            </div>
                        </div>
                        <span>→</span>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Mobile Nav -->
        <nav class="mobile-nav">
            <div class="mobile-nav-inner">
                <button class="mobile-nav-item active" data-page="home">
                    <span class="mobile-nav-item-icon">🏠</span>
                    <span>首頁</span>
                </button>
                <button class="mobile-nav-item" data-page="map">
                    <span class="mobile-nav-item-icon">🗺️</span>
                    <span>地圖</span>
                </button>
                <button class="mobile-nav-item" data-page="photos">
                    <span class="mobile-nav-item-icon">📸</span>
                    <span>相片</span>
                </button>
                <button class="mobile-nav-item" data-page="settings">
                    <span class="mobile-nav-item-icon">⚙️</span>
                    <span>設定</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        // Default trip data
        const defaultTrips = [
            {
                id: 1,
                name: '深圳灣一日遊',
                date: '2026-06-07',
                location: '🇨🇳 深圳',
                country: 'china',
                places: [
                    { name: '深圳灣口岸', lat: 22.4709, lng: 113.9295, type: 'transport', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', lat: 22.4938, lng: 113.9304, type: 'leisure', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', lat: 22.4855, lng: 113.9412, type: 'food', icon: '🍽️', time: '15:52' },
                    { name: '蔡潤越南粉', lat: 22.5012, lng: 113.9283, type: 'food', icon: '🍽️', time: '20:13' }
                ],
                expenses: [
                    { name: 'ZAKC直通車（去程）', amount: 60.00, category: '交通', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', amount: 231.48, category: '休閒', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', amount: 231.48, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'NEED創意韓國料理（加單）', amount: 37.22, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'ZAKC直通車（回程）', amount: 60.00, category: '交通', icon: '🚌', time: '16:49' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '蔡潤越南粉', amount: 147.73, category: '餐飲', icon: '🍽️', time: '20:13' }
                ]
            }
        ];

        let trips = JSON.parse(localStorage.getItem('travelTrips')) || JSON.parse(JSON.stringify(defaultTrips));
        let photos = JSON.parse(localStorage.getItem('travelPhotos')) || [];
        let currentTrip = null;
        let currentCalMonth = new Date();
        let fullMap = null;
        let tripMap = null;
        let detailPieChart, detailBarChart;
        
        const typeColors = {
            transport: '#3b82f6',
            food: '#f97316',
            leisure: '#10b981',
            shopping: '#8b5cf6'
        };
        
        const typeLabels = {
            transport: '交通',
            food: '餐飲',
            leisure: '休閒',
            shopping: '購物'
        };

        // Theme
        let isDark = localStorage.getItem('theme') !== 'light';

        function setTheme(dark) {
            isDark = dark;
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('themeToggle').textContent = '☀️';
                document.getElementById('themeToggleIcon').textContent = '☀️';
                document.getElementById('themeToggleLabel').textContent = '淺色模式';
                document.querySelector('#themeToggleSetting .toggle').classList.add('active');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('themeToggle').textContent = '🌙';
                document.getElementById('themeToggleIcon').textContent = '🌙';
                document.getElementById('themeToggleLabel').textContent = '深色模式';
                document.querySelector('#themeToggleSetting .toggle').classList.remove('active');
            }
            localStorage.setItem('theme', dark ? 'dark' : 'light');

            // Refresh maps
            if (fullMap) { fullMap.remove(); fullMap = null; }
            if (tripMap) { tripMap.remove(); tripMap = null; }

            // Re-init full map if on map page
            if (document.getElementById('page-map').classList.contains('active')) {
                setTimeout(initFullMap, 100);
            }
        }

        document.getElementById('themeToggle').addEventListener('click', () => setTheme(!isDark));
        document.getElementById('themeToggleSetting').addEventListener('click', () => setTheme(!isDark));

        if (localStorage.getItem('theme') === 'light') {
            setTheme(false);
        } else {
            setTheme(true);
        }

        // Navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll(`[data-page="${pageId}"]`).forEach(n => n.classList.add('active'));
            
            if (pageId !== 'home' && currentTrip) {
                document.getElementById('tripDetail').classList.remove('active');
            }
            
            if (pageId === 'map') {
                setTimeout(initFullMap, 100);
            }
            
            if (pageId === 'photos') {
                renderPhotos();
            }
        }

        document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(btn => {
            btn.addEventListener('click', () => showPage(btn.dataset.page));
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            currentTrip = null;
            document.getElementById('tripDetail').classList.remove('active');
            renderTripList();
        });

        // Home Calendar
        function renderHomeCalendar() {
            const year = currentCalMonth.getFullYear();
            const month = currentCalMonth.getMonth();
            
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            document.getElementById('currentMonth').textContent = `${year}年 ${monthNames[month]}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            let html = '<div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>';
            
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="cal-day empty"></div>';
            }
            
            const tripDates = {};
            trips.forEach(t => {
                const d = t.date.substring(0, 10);
                if (!tripDates[d]) tripDates[d] = [];
                tripDates[d].push(t);
            });
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasTrip = tripDates[dateStr];
                
                if (hasTrip) {
                    html += `<div class="cal-day has-trip" data-date="${dateStr}">
                        <div class="cal-day-number">${day}</div>
                        <div class="cal-day-dot"></div>
                    </div>`;
                } else {
                    html += `<div class="cal-day" data-date="${dateStr}"><div class="cal-day-number">${day}</div></div>`;
                }
            }
            
            document.getElementById('homeCalGrid').innerHTML = html;
            
            // Click handlers
            document.querySelectorAll('.cal-day.has-trip').forEach(day => {
                day.addEventListener('click', () => {
                    const dateStr = day.dataset.date;
                    // Highlight selected day
                    document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected-day'));
                    day.classList.add('selected-day');
                    // Filter by date (not jump to detail)
                    filterTripsByDate(dateStr);
                });
            });
        }

        function filterTripsByDate(dateStr) {
            currentDateFilter = dateStr;
            let filtered = trips.filter(t => t.date.startsWith(dateStr));
            if (currentCountry !== 'all') {
                filtered = filtered.filter(t => t.location === currentCountry);
            }
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(t =>
                    t.name.toLowerCase().includes(search) ||
                    t.location.toLowerCase().includes(search)
                );
            }
            renderTripList(filtered);
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentCalMonth.setMonth(currentCalMonth.getMonth() - 1);
            renderHomeCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentCalMonth.setMonth(currentCalMonth.getMonth() + 1);
            renderHomeCalendar();
        });

        // Destination Filter
        let currentCountry = 'all';
        let currentDateFilter = null;

        function filterTrips() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = trips;

            if (currentCountry !== 'all') {
                filtered = filtered.filter(t => t.location === currentCountry);
            }

            if (currentDateFilter) {
                filtered = filtered.filter(t => t.date.startsWith(currentDateFilter));
            }

            if (search) {
                filtered = filtered.filter(t =>
                    t.name.toLowerCase().includes(search) ||
                    t.location.toLowerCase().includes(search)
                );
            }

            renderTripList(filtered);
        }

        document.querySelectorAll('.country-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCountry = btn.dataset.country;
                document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDateFilter = null;
                document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected-day'));
                filterTrips();
            });
        });

        document.getElementById('searchInput').addEventListener('input', () => filterTrips());

        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let filteredTrips = trips;

        function renderTripList(tripData = trips) {
            const container = document.getElementById('tripList');
            filteredTrips = tripData;

            if (tripData.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🦵</div><div class="empty-state-text">沒有找到旅程記錄</div></div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            currentPage = 1;
            renderPaginatedTrips();
            renderPagination();
        }

        function renderPaginatedTrips() {
            const container = document.getElementById('tripList');
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageTrips = filteredTrips.slice(start, end);

            container.innerHTML = pageTrips.map((trip, i) => {
                const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
                return `
                    <div class="trip-card stagger-${Math.min(i + 1, 5)}" data-id="${trip.id}">
                        <div class="trip-header">
                            <div class="trip-info">
                                <div class="trip-title">${trip.name}</div>
                                <div class="trip-date">📅 ${trip.date}</div>
                            </div>
                            <div class="trip-location-badge">${trip.location}</div>
                        </div>
                        <div class="trip-stats">
                            <div class="trip-stat">
                                <span class="trip-stat-icon">💰</span>
                                <span class="trip-stat-value">$${total.toFixed(0)}</span>
                                <span class="trip-stat-label">消費</span>
                            </div>
                            <div class="trip-stat">
                                <span class="trip-stat-icon">📍</span>
                                <span class="trip-stat-value">${trip.places.length}</span>
                                <span class="trip-stat-label">地點</span>
                            </div>
                            <div class="trip-stat">
                                <span class="trip-stat-icon">🧾</span>
                                <span class="trip-stat-value">${trip.expenses.length}</span>
                                <span class="trip-stat-label">記錄</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('.trip-card').forEach(card => {
                card.addEventListener('click', () => showTripDetail(parseInt(card.dataset.id)));
            });
        }

        function renderPagination() {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredTrips.length / ITEMS_PER_PAGE);

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            container.innerHTML = html;

            container.querySelectorAll('.pagination-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    renderPaginatedTrips();
                    renderPagination();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        // Trip Detail
        function showTripDetail(id) {
            const trip = trips.find(t => t.id === id);
            if (!trip) return;
            
            currentTrip = trip;
            document.getElementById('detailTitle').textContent = trip.name;
            document.getElementById('detailMeta').textContent = `${trip.date} · ${trip.location}`;
            
            const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
            
            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card stagger-1">
                    <div class="stat-icon">💰</div>
                    <div class="stat-value">$${total.toFixed(0)}</div>
                    <div class="stat-label">總消費</div>
                </div>
                <div class="stat-card stagger-2">
                    <div class="stat-icon">📍</div>
                    <div class="stat-value">${trip.places.length}</div>
                    <div class="stat-label">地點</div>
                </div>
                <div class="stat-card stagger-3">
                    <div class="stat-icon">🧾</div>
                    <div class="stat-value">${trip.expenses.length}</div>
                    <div class="stat-label">記錄</div>
                </div>
                <div class="stat-card stagger-4">
                    <div class="stat-icon">🍽️</div>
                    <div class="stat-value">${Object.keys(trip.expenses.reduce((a, e) => (a[e.category] = 1, a), {})).length}</div>
                    <div class="stat-label">類別</div>
                </div>
            `;
            
            document.getElementById('placeList').innerHTML = trip.places.map(p => `
                <div class="place-item">
                    <div class="place-icon">${p.icon}</div>
                    <div>
                        <div class="place-name">${p.name}</div>
                        <div class="place-time">🕐 ${p.time} · ${typeLabels[p.type] || p.type}</div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('expenseList').innerHTML = trip.expenses.map((exp, i) => `
                <div class="expense-item" style="animation-delay: ${i * 0.03}s">
                    <div class="expense-left">
                        <div class="expense-icon">${exp.icon}</div>
                        <div class="expense-info">
                            <div class="name">${exp.name}</div>
                            <div class="meta">${exp.category} · ${exp.time}</div>
                        </div>
                    </div>
                    <div class="expense-amount">−$${exp.amount.toFixed(2)}</div>
                </div>
            `).join('');
            
            renderDetailCharts(trip);
            document.getElementById('tripDetail').classList.add('active');
            document.getElementById('page-home').classList.remove('active');
            setTimeout(() => initTripMap(trip), 100);
        }

        // Map toggle
        document.getElementById('mapToggle').addEventListener('click', function() {
            const wrapper = document.getElementById('mapWrapper');
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                this.textContent = '收合';
                if (tripMap) setTimeout(() => tripMap.invalidateSize(), 100);
            } else {
                wrapper.style.display = 'none';
                this.textContent = '展開';
            }
        });

        function initTripMap(trip) {
            if (tripMap) { tripMap.remove(); tripMap = null; }
            if (trip.places.length === 0) return;
            
            tripMap = L.map('map', { zoomControl: true }).setView([trip.places[0].lat, trip.places[0].lng], 14);
            
            const tileUrl = isDark 
                ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            
            L.tileLayer(tileUrl, { attribution: '© OpenStreetMap © CARTO', maxZoom: 19 }).addTo(tripMap);
            
            trip.places.forEach(place => {
                const color = typeColors[place.type] || '#64748b';
                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px ${color}66;font-size:14px;border:2px solid rgba(255,255,255,0.3);">${place.icon}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });
                
                L.marker([place.lat, place.lng], { icon })
                    .bindPopup(`<b>${place.name}</b><br><span>${place.icon} ${typeLabels[place.type]}</span><br><span>🕐 ${place.time}</span>`)
                    .addTo(tripMap);
            });
            
            const group = L.featureGroup(trip.places.map(p => L.marker([p.lat, p.lng])));
            tripMap.fitBounds(group.getBounds().pad(0.3));
        }

        function initFullMap() {
            const mapEl = document.getElementById('fullMap');
            if (!mapEl) return;

            // Update info bar
            let totalPlaces = 0;
            let tripCount = 0;
            trips.forEach(t => { if (t.places.length > 0) tripCount++; totalPlaces += t.places.length; });
            document.getElementById('mapPlaceCount').textContent = `共 ${totalPlaces} 個地點`;
            document.getElementById('mapTripCount').textContent = `${tripCount} 個旅程`;

            if (fullMap) { fullMap.remove(); fullMap = null; }
            
            fullMap = L.map('fullMap', { 
                zoomControl: true,
                attributionControl: true
            }).setView([22.5, 114], 10);
            
            const tileUrl = isDark 
                ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
                : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            
            L.tileLayer(tileUrl, { 
                attribution: '© OpenStreetMap contributors © CARTO',
                maxZoom: 19
            }).addTo(fullMap);
            
            trips.forEach(trip => {
                trip.places.forEach(place => {
                    const color = typeColors[place.type] || '#64748b';
                    const icon = L.divIcon({
                        className: 'custom-marker',
                        html: `<div style="background:${color};width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px ${color}88;font-size:16px;border:3px solid rgba(255,255,255,0.4);">${place.icon}</div>`,
                        iconSize: [36, 36],
                        iconAnchor: [18, 18]
                    });
                    
                    L.marker([place.lat, place.lng], { icon })
                        .bindPopup(`<b>${place.name}</b><br><span>${trip.name}</span><br><span>${place.icon} ${typeLabels[place.type]}</span>`)
                        .addTo(fullMap);
                });
            });
            
            // Fit all markers
            const allMarkers = [];
            trips.forEach(trip => {
                trip.places.forEach(p => allMarkers.push(L.marker([p.lat, p.lng])));
            });
            if (allMarkers.length > 0) {
                const group = L.featureGroup(allMarkers);
                fullMap.fitBounds(group.getBounds().pad(0.2));
            }
            
            setTimeout(() => fullMap.invalidateSize(), 100);
        }

        // Charts
        function renderDetailCharts(trip) {
            const totals = { '交通': 0, '餐飲': 0, '休閒': 0, '購物': 0 };
            trip.expenses.forEach(exp => {
                if (totals[exp.category] !== undefined) totals[exp.category] += exp.amount;
            });
            
            const labels = Object.keys(totals).filter(k => totals[k] > 0);
            const data = labels.map(l => totals[l]);
            const colors = labels.map(l => l === '交通' ? '#3b82f6' : l === '餐飲' ? '#f97316' : l === '休閒' ? '#10b981' : '#8b5cf6');
            
            if (detailPieChart) detailPieChart.destroy();
            if (detailBarChart) detailBarChart.destroy();
            
            detailPieChart = new Chart(document.getElementById('detailPieChart'), {
                type: 'doughnut',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0, cutout: '60%' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8899a6', font: { size: 11 }, padding: 12 } } } }
            });
            
            detailBarChart = new Chart(document.getElementById('detailBarChart'), {
                type: 'bar',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 6, borderSkipped: false }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#8899a6', font: { size: 11 } } }, y: { grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#8899a6', font: { size: 11 } } } } }
            });
        }

        // Photos
        function renderPhotos() {
            const container = document.getElementById('photoGrid');
            const empty = document.getElementById('photoEmpty');
            
            if (photos.length === 0) {
                empty.style.display = 'block';
                container.innerHTML = `
                    <div class="photo-item photo-add" id="addPhoto">
                        <span class="photo-add-icon">➕</span>
                    </div>
                `;
            } else {
                empty.style.display = 'none';
                container.innerHTML = photos.map((p, i) => `
                    <div class="photo-item" data-index="${i}">
                        <span class="photo-placeholder">🖼️</span>
                    </div>
                `).join('') + `
                    <div class="photo-item photo-add" id="addPhoto">
                        <span class="photo-add-icon">➕</span>
                    </div>
                `;
            }
            
            document.getElementById('addPhoto').addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.multiple = true;
                input.onchange = (e) => {
                    Array.from(e.target.files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            photos.push({ url: ev.target.result, date: new Date().toISOString().split('T')[0] });
                            localStorage.setItem('travelPhotos', JSON.stringify(photos));
                            renderPhotos();
                        };
                        reader.readAsDataURL(file);
                    });
                };
                input.click();
            });
        }

        // Export/Import
        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = JSON.stringify({ trips, photos }, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'travel-records.json';
            a.click();
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.trips) trips = data.trips;
                        if (data.photos) photos = data.photos;
                        localStorage.setItem('travelTrips', JSON.stringify(trips));
                        localStorage.setItem('travelPhotos', JSON.stringify(photos));
                        renderHomeCalendar();
                        renderTripList();
                    } catch (err) {
                        alert('格式無效');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // Init
        function init() {
            renderHomeCalendar();
            renderTripList();
        }

        init();
    </script>
</body>
</html>
