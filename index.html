<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦵 旅行足迹檔案</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-primary: #0f1923;
            --bg-secondary: #1a2634;
            --bg-card: #1e2a38;
            --text-primary: #ffffff;
            --text-secondary: #8899a6;
            --accent: #10b981;
            --accent-hover: #0ea572;
            --border: rgba(255,255,255,0.08);
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        
        [data-theme="light"] {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a2634;
            --text-secondary: #5c6c7c;
            --border: rgba(0,0,0,0.08);
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
        }
        
        /* Layout */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 72px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }
        
        .sidebar-logo {
            font-size: 26px;
            margin-bottom: 24px;
        }
        
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            padding: 0 12px;
        }
        
        .nav-item {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
            background: transparent;
            border: none;
        }
        
        .nav-item:hover {
            background: var(--border);
        }
        
        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }
        
        .nav-item-label {
            font-size: 9px;
            margin-top: 4px;
            font-weight: 500;
        }
        
        .nav-item-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .sidebar-spacer { flex: 1; }
        
        .sidebar-theme {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: none;
            background: var(--bg-card);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 72px;
            padding: 24px;
            max-width: 1000px;
        }
        
        /* Page */
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        /* Header */
        .page-header {
            margin-bottom: 24px;
        }
        
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        
        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* Quick Stats */
        .quick-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border);
        }
        
        .stat-icon { font-size: 24px; margin-bottom: 8px; }
        .stat-value { font-size: 22px; font-weight: 700; }
        .stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        
        /* Country Grid */
        .country-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        
        .country-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .country-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .country-card .flag { font-size: 32px; margin-bottom: 6px; }
        .country-card .name { font-size: 12px; font-weight: 600; }
        .country-card .count { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        
        /* Search */
        .search-bar {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        
        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }
        
        .search-bar input::placeholder { color: var(--text-secondary); }
        .search-icon { color: var(--text-secondary); font-size: 18px; }
        
        /* Filter Pills */
        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .filter-pill {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .filter-pill:hover { border-color: var(--accent); }
        .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        
        /* Expense List */
        .expense-item {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }
        
        .expense-left { display: flex; align-items: center; gap: 12px; }
        .expense-icon {
            width: 44px; height: 44px;
            background: var(--bg-secondary);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .expense-info .name { font-size: 15px; font-weight: 500; }
        .expense-info .meta { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .expense-amount { font-size: 16px; font-weight: 700; color: #f87171; }
        
        /* Charts */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .chart-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        
        .chart-card-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .chart-container { height: 200px; position: relative; }
        
        /* Map */
        #map {
            height: 400px;
            border-radius: 16px;
            z-index: 1;
        }
        
        .map-toggle {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        
        /* Trip List */
        .trip-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }
        
        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .trip-date { font-size: 12px; color: var(--text-secondary); }
        .trip-location {
            background: rgba(16,185,129,0.15);
            color: var(--accent);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 10px;
        }
        
        .trip-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        
        .trip-expenses {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .expense-tag {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .expense-tag .amount { color: #f87171; font-weight: 600; }
        
        /* Settings */
        .settings-group {
            margin-bottom: 24px;
        }
        
        .settings-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .settings-item {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            cursor: pointer;
        }
        
        .settings-item-left { display: flex; align-items: center; gap: 12px; }
        .settings-item-icon { font-size: 20px; }
        .settings-item-label { font-size: 15px; }
        .settings-item-desc { font-size: 12px; color: var(--text-secondary); }
        
        /* Toggle Switch */
        .toggle {
            width: 48px;
            height: 28px;
            background: var(--bg-secondary);
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .toggle.active { background: var(--accent); }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.2s;
        }
        
        .toggle.active::after { transform: translateX(20px); }
        
        /* Mobile Bottom Nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            z-index: 100;
        }
        
        .mobile-nav-inner {
            display: flex;
            justify-content: space-around;
        }
        
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            transition: all 0.2s;
            border: none;
            background: none;
        }
        
        .mobile-nav-item.active { color: var(--accent); }
        .mobile-nav-item-icon { font-size: 22px; }
        
        /* Leaflet dark theme */
        .leaflet-popup-content-wrapper { background: var(--bg-card); color: var(--text-primary); border-radius: 12px; }
        .leaflet-popup-tip { background: var(--bg-card); }
        .leaflet-control-zoom a { background: var(--bg-card) !important; color: var(--text-primary) !important; }
        .leaflet-control-attribution { background: var(--bg-card) !important; color: var(--text-secondary) !important; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 16px; padding-bottom: 100px; }
            .mobile-nav { display: block; }
            .quick-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .stat-value { font-size: 18px; }
            .chart-grid { grid-template-columns: 1fr; }
            .country-grid { grid-template-columns: repeat(3, 1fr); }
        }
        
        @media (max-width: 480px) {
            .page-header h1 { font-size: 24px; }
            .quick-stats { grid-template-columns: 1fr; }
            .stat-card { display: flex; align-items: center; gap: 12px; text-align: left; }
            .stat-icon { margin-bottom: 0; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-logo">🦵</div>
            <div class="sidebar-nav">
                <button class="nav-item active" data-page="home">
                    <span>🏠</span>
                </button>
                <button class="nav-item" data-page="map">
                    <span>🗺️</span>
                </button>
                <button class="nav-item" data-page="stats">
                    <span>📊</span>
                </button>
                <button class="nav-item" data-page="trips">
                    <span>📅</span>
                </button>
                <button class="nav-item" data-page="search">
                    <span>🔍</span>
                </button>
                <button class="nav-item" data-page="settings">
                    <span>⚙️</span>
                </button>
            </div>
            <div class="sidebar-spacer"></div>
            <button class="sidebar-theme" id="themeToggle">🌙</button>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Home Page -->
            <div class="page active" id="page-home">
                <div class="page-header">
                    <h1>🦵 旅行足迹</h1>
                    <p>記錄你的每一段旅程</p>
                </div>
                
                <div class="quick-stats">
                    <div class="stat-card">
                        <div class="stat-icon">✈️</div>
                        <div class="stat-value" id="totalTrips">0</div>
                        <div class="stat-label">旅程</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-value" id="totalSpent">$0</div>
                        <div class="stat-label">總消費</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">📍</div>
                        <div class="stat-value" id="totalPlaces">0</div>
                        <div class="stat-label">地點</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">🏷️ 國家分類</div>
                    <div class="country-grid" id="countryGrid"></div>
                </div>
                
                <div class="card">
                    <div class="card-title">💸 消費概覽</div>
                    <div id="expenseSummary"></div>
                </div>
            </div>
            
            <!-- Map Page -->
            <div class="page" id="page-map">
                <div class="page-header">
                    <h1>🗺️ 足迹地圖</h1>
                    <p>你走過的地方</p>
                </div>
                <button class="map-toggle" id="mapToggle">展開地圖</button>
                <div id="mapWrapper" style="display:none;">
                    <div id="map"></div>
                </div>
            </div>
            
            <!-- Stats Page -->
            <div class="page" id="page-stats">
                <div class="page-header">
                    <h1>📊 消費統計</h1>
                    <p>分析你的消費習慣</p>
                </div>
                <div class="chart-grid">
                    <div class="chart-card">
                        <div class="chart-card-title">📊 消費分佈</div>
                        <div class="chart-container">
                            <canvas id="pieChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="chart-card-title">📈 類別比較</div>
                        <div class="chart-container">
                            <canvas id="barChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Trips Page -->
            <div class="page" id="page-trips">
                <div class="page-header">
                    <h1>📅 旅程記錄</h1>
                    <p>所有行程一目了然</p>
                </div>
                <div id="tripList"></div>
            </div>
            
            <!-- Search Page -->
            <div class="page" id="page-search">
                <div class="page-header">
                    <h1>🔍 搜尋</h1>
                    <p>快速搵到消費記錄</p>
                </div>
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜尋餐廳、地點...">
                </div>
                <div class="filter-pills" id="categoryFilters">
                    <div class="filter-pill active" data-value="all">全部</div>
                    <div class="filter-pill" data-value="交通">🚌 交通</div>
                    <div class="filter-pill" data-value="餐飲">🍽️ 餐飲</div>
                    <div class="filter-pill" data-value="休閒">💆 休閒</div>
                    <div class="filter-pill" data-value="購物">🛍️ 購物</div>
                </div>
                <div id="searchResults"></div>
            </div>
            
            <!-- Settings Page -->
            <div class="page" id="page-settings">
                <div class="page-header">
                    <h1>⚙️ 設定</h1>
                    <p>自訂你的旅行档案</p>
                </div>
                
                <div class="settings-group">
                    <div class="settings-title">外觀</div>
                    <div class="settings-item">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">🌙</span>
                            <div>
                                <div class="settings-item-label">深色模式</div>
                                <div class="settings-item-desc">開啟深色主題</div>
                            </div>
                        </div>
                        <div class="toggle active" id="darkModeToggle"></div>
                    </div>
                </div>
                
                <div class="settings-group">
                    <div class="settings-title">數據</div>
                    <div class="settings-item" id="exportBtn">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">📤</span>
                            <div>
                                <div class="settings-item-label">匯出數據</div>
                                <div class="settings-item-desc">下載你的旅行記錄</div>
                            </div>
                        </div>
                        <span>→</span>
                    </div>
                    <div class="settings-item" id="importBtn">
                        <div class="settings-item-left">
                            <span class="settings-item-icon">📥</span>
                            <div>
                                <div class="settings-item-label">匯入數據</div>
                                <div class="settings-item-desc">從備份恢復</div>
                            </div>
                        </div>
                        <span>→</span>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Mobile Bottom Nav -->
        <nav class="mobile-nav">
            <div class="mobile-nav-inner">
                <button class="mobile-nav-item active" data-page="home">
                    <span class="mobile-nav-item-icon">🏠</span>
                    <span>首頁</span>
                </button>
                <button class="mobile-nav-item" data-page="map">
                    <span class="mobile-nav-item-icon">🗺️</span>
                    <span>地圖</span>
                </button>
                <button class="mobile-nav-item" data-page="stats">
                    <span class="mobile-nav-item-icon">📊</span>
                    <span>統計</span>
                </button>
                <button class="mobile-nav-item" data-page="trips">
                    <span class="mobile-nav-item-icon">📅</span>
                    <span>旅程</span>
                </button>
                <button class="mobile-nav-item" data-page="settings">
                    <span class="mobile-nav-item-icon">⚙️</span>
                    <span>設定</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        // Trip data
        const defaultTrips = [
            {
                id: 1,
                name: '深圳灣一日遊',
                date: '2026-06-07',
                location: '🇨🇳 深圳',
                country: 'china',
                places: [
                    { name: '深圳灣口岸', lat: 22.4709, lng: 113.9295, type: 'transport', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', lat: 22.4938, lng: 113.9304, type: 'leisure', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', lat: 22.4855, lng: 113.9412, type: 'food', icon: '🍽️', time: '15:52' },
                    { name: '蔡潤越南粉', lat: 22.5012, lng: 113.9283, type: 'food', icon: '🍽️', time: '20:13' }
                ],
                expenses: [
                    { name: 'ZAKC直通車（去程）', amount: 60.00, category: '交通', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', amount: 231.48, category: '休閒', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', amount: 231.48, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'NEED創意韓國料理（加單）', amount: 37.22, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'ZAKC直通車（回程）', amount: 60.00, category: '交通', icon: '🚌', time: '16:49' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '蔡潤越南粉', amount: 147.73, category: '餐飲', icon: '🍽️', time: '20:13' }
                ]
            }
        ];

        let trips = JSON.parse(localStorage.getItem('travelTrips')) || JSON.parse(JSON.stringify(defaultTrips));
        let map = null;
        let markers = [];
        let pieChart, barChart;
        
        // Country flags
        const countryFlags = {
            'china': { flag: '🇨🇳', name: '中國', emoji: '深圳/上海/北京' },
            'hongkong': { flag: '🇭🇰', name: '香港', emoji: '香港' },
            'macau': { flag: '🇲🇴', name: '澳門', emoji: '澳門' },
            'taiwan': { flag: '🇹🇼', name: '台灣', emoji: '台北/台中' },
            'japan': { flag: '🇯🇵', name: '日本', emoji: '東京/大阪' },
            'korea': { flag: '🇰🇷', name: '韓國', emoji: '首爾/釜山' },
            'australia': { flag: '🇦🇺', name: '澳洲', emoji: '悉尼/墨爾本' },
            'usa': { flag: '🇺🇸', name: '美國', emoji: '紐約/LA' },
            'europe': { flag: '🇪🇺', name: '歐洲', emoji: '英法德' }
        };

        // Theme
        const themeToggle = document.getElementById('themeToggle');
        const darkModeToggle = document.getElementById('darkModeToggle');
        
        function setTheme(dark) {
            if (dark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
                darkModeToggle.classList.add('active');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeToggle.textContent = '🌙';
                darkModeToggle.classList.remove('active');
            }
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }
        
        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.hasAttribute('data-theme');
            setTheme(!isDark);
        });
        
        darkModeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.hasAttribute('data-theme');
            setTheme(!isDark);
        });
        
        // Init theme
        if (localStorage.getItem('theme') === 'light') {
            setTheme(false);
        } else {
            setTheme(true);
        }

        // Navigation
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll(`[data-page="${pageId}"]`).forEach(n => n.classList.add('active'));
            
            if (pageId === 'map' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
        }
        
        document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(btn => {
            btn.addEventListener('click', () => showPage(btn.dataset.page));
        });

        // Stats
        function updateStats() {
            const totalSpent = trips.reduce((sum, t) => sum + t.expenses.reduce((s, e) => s + e.amount, 0), 0);
            const totalPlaces = trips.reduce((sum, t) => sum + t.places.length, 0);
            
            document.getElementById('totalTrips').textContent = trips.length;
            document.getElementById('totalSpent').textContent = '$' + Math.round(totalSpent);
            document.getElementById('totalPlaces').textContent = totalPlaces;
        }

        // Country Grid
        function renderCountryGrid() {
            const grid = document.getElementById('countryGrid');
            const countries = {};
            
            trips.forEach(trip => {
                const country = trip.country || 'china';
                if (!countries[country]) {
                    countries[country] = { flag: countryFlags[country]?.flag || '📍', name: countryFlags[country]?.name || trip.location, count: 0 };
                }
                countries[country].count++;
            });
            
            grid.innerHTML = Object.entries(countries).map(([key, c]) => `
                <div class="country-card">
                    <div class="flag">${c.flag}</div>
                    <div class="name">${c.name}</div>
                    <div class="count">${c.count} 個旅程</div>
                </div>
            `).join('');
        }

        // Expense Summary
        function renderExpenseSummary() {
            const summary = {};
            trips.forEach(trip => {
                trip.expenses.forEach(exp => {
                    if (!summary[exp.category]) {
                        summary[exp.category] = { icon: exp.icon, total: 0 };
                    }
                    summary[exp.category].total += exp.amount;
                });
            });
            
            const container = document.getElementById('expenseSummary');
            container.innerHTML = Object.entries(summary).map(([cat, data]) => `
                <div class="expense-item">
                    <div class="expense-left">
                        <div class="expense-icon">${data.icon}</div>
                        <div class="expense-info">
                            <div class="name">${cat}</div>
                        </div>
                    </div>
                    <div class="expense-amount">$${data.total.toFixed(0)}</div>
                </div>
            `).join('');
        }

        // Trip List
        function renderTripList() {
            const container = document.getElementById('tripList');
            container.innerHTML = trips.map(trip => {
                const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
                return `
                    <div class="trip-card">
                        <div class="trip-header">
                            <div class="trip-date">${trip.date}</div>
                            <div class="trip-location">${trip.location}</div>
                        </div>
                        <div class="trip-title">${trip.name}</div>
                        <div class="trip-expenses">
                            ${trip.expenses.slice(0, 4).map(exp => `
                                <div class="expense-tag">
                                    <span>${exp.icon}</span>
                                    <span class="amount">−$${exp.amount.toFixed(0)}</span>
                                </div>
                            `).join('')}
                            ${trip.expenses.length > 4 ? `<div class="expense-tag">+${trip.expenses.length - 4}項</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Search
        function renderSearch(query, category) {
            const container = document.getElementById('searchResults');
            let results = [];
            
            trips.forEach(trip => {
                trip.expenses.forEach(exp => {
                    if ((!query || exp.name.toLowerCase().includes(query.toLowerCase()) || exp.category.includes(query)) &&
                        (!category || category === 'all' || exp.category === category)) {
                        results.push({...exp, tripName: trip.name, tripDate: trip.date});
                    }
                });
            });
            
            if (results.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">沒有找到消費記錄</div>';
                return;
            }
            
            container.innerHTML = results.map(exp => `
                <div class="expense-item">
                    <div class="expense-left">
                        <div class="expense-icon">${exp.icon}</div>
                        <div class="expense-info">
                            <div class="name">${exp.name}</div>
                            <div class="meta">${exp.tripName} · ${exp.time}</div>
                        </div>
                    </div>
                    <div class="expense-amount">−$${exp.amount.toFixed(2)}</div>
                </div>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const cat = document.query('#categoryFilters .filter-pill.active')?.dataset.value || 'all';
            renderSearch(e.target.value, cat);
        });

        document.getElementById('categoryFilters').addEventListener('click', (e) => {
            const pill = e.target.closest('.filter-pill');
            if (!pill) return;
            document.querySelectorAll('#categoryFilters .filter-pill').forEach(p => p.classList.remove('active'));
            pill.classList.add('active');
            const query = document.getElementById('searchInput').value;
            renderSearch(query, pill.dataset.value);
        });

        // Map
        document.getElementById('mapToggle').addEventListener('click', function() {
            const wrapper = document.getElementById('mapWrapper');
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                this.textContent = '收合地圖';
                if (map) setTimeout(() => map.invalidateSize(), 100);
            } else {
                wrapper.style.display = 'none';
                this.textContent = '展開地圖';
            }
        });

        function initMap() {
            map = L.map('map').setView([22.5, 114], 10);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '© OpenStreetMap © CARTO',
                maxZoom: 19
            }).addTo(map);
            
            updateMapMarkers();
        }

        function updateMapMarkers() {
            if (!map) return;
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            
            const typeLabels = { transport: '交通', food: '餐飲', leisure: '休閒', shopping: '購物' };
            const colors = { transport: '#3b82f6', food: '#f97316', leisure: '#10b981', shopping: '#8b5cf6' };
            
            trips.forEach(trip => {
                trip.places.forEach(place => {
                    const color = colors[place.type] || '#64748b';
                    const icon = L.divIcon({
                        className: 'custom-marker',
                        html: `<div style="background:${color};width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.3);"><span style="transform:rotate(45deg);font-size:14px;">${place.icon}</span></div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 32]
                    });
                    
                    const marker = L.marker([place.lat, place.lng], { icon });
                    marker.bindPopup(`<b>${place.name}</b><br>${place.icon} ${typeLabels[place.type]}<br>🕐 ${place.time}`);
                    marker.addTo(map);
                    markers.push(marker);
                });
            });
            
            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
            }
        }

        // Charts
        function initCharts() {
            const totals = { transport: 0, food: 0, leisure: 0, shopping: 0 };
            const catMap = { '交通': 'transport', '餐飲': 'food', '休閒': 'leisure', '購物': 'shopping' };
            
            trips.forEach(trip => {
                trip.expenses.forEach(exp => {
                    const key = catMap[exp.category] || 'shopping';
                    totals[key] += exp.amount;
                });
            });
            
            const data = [totals.transport, totals.food, totals.leisure, totals.shopping];
            const colors = ['#3b82f6', '#f97316', '#10b981', '#8b5cf6'];
            
            pieChart = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: {
                    labels: ['交通', '餐飲', '休閒', '購物'],
                    datasets: [{ data, backgroundColor: colors, borderWidth: 0, cutout: '65%' }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8899a6', font: { size: 11 }, padding: 10 } } } }
            });
            
            barChart = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: ['交通', '餐飲', '休閒', '購物'],
                    datasets: [{ data, backgroundColor: colors, borderRadius: 6, borderSkipped: false }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false }, ticks: { color: '#8899a6' } },
                              y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8899a6' } } }
                }
            });
        }

        // Export/Import
        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = JSON.stringify(trips, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'travel-records.json';
            a.click();
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        trips = JSON.parse(ev.target.result);
                        localStorage.setItem('travelTrips', JSON.stringify(trips));
                        init();
                    } catch (err) {
                        alert('Invalid file format');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        });

        // Init
        function init() {
            updateStats();
            renderCountryGrid();
            renderExpenseSummary();
            renderTripList();
            renderSearch('', 'all');
            initMap();
            initCharts();
        }
        
        init();
    </script>
</body>
</html>
