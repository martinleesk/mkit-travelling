<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MKiT Travelling | 旅程記錄</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* SVG Icons */
        .svg-icon { width: 24px; height: 24px; display: inline-block; vertical-align: middle; }
        .svg-icon-sm { width: 18px; height: 18px; }
        .svg-icon-lg { width: 32px; height: 32px; }
        .svg-icon-xl { width: 48px; height: 48px; }

        :root {
            /* Vibrant Color Palette */
            --bg-primary: #0f0a1e;
            --bg-secondary: #1a1230;
            --bg-card: #241840;
            --bg-card-hover: #2e2055;
            --text-primary: #f8f4ff;
            --text-secondary: #b8a9d4;
            --text-muted: #7c6a9e;
            
            /* Vibrant Accents */
            --accent-red: #ff6b6b;
            --accent-orange: #ffa94d;
            --accent-yellow: #ffd43b;
            --accent-green: #69db7c;
            --accent-blue: #4dabf7;
            --accent-purple: #da77f2;
            --accent-pink: #f783ac;
            
            /* Active accent (gradient) */
            --accent: linear-gradient(135deg, var(--accent-pink), var(--accent-purple), var(--accent-blue));
            --accent-solid: #da77f2;
            --accent-soft: rgba(218, 119, 242, 0.15);
            --accent-glow: rgba(218, 119, 242, 0.3);
            
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-glow: 0 0 24px var(--accent-glow);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-xs: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        [data-theme="light"] {
            --bg-primary: #fff5f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #fff0f5;
            --text-primary: #2d1f3d;
            --text-secondary: #7c6a9e;
            --text-muted: #b8a9d4;
            --border: rgba(0, 0, 0, 0.06);
            --border-hover: rgba(0, 0, 0, 0.12);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }
        
        /* p5.js Canvas */
        #p5-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }
        
        /* ASCII Art Decorations */
        .ascii-deco {
            position: fixed;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1;
            color: var(--accent-purple);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            white-space: pre;
            user-select: none;
        }
        
        .ascii-deco-1 { top: 10%; left: 2%; }
        .ascii-deco-2 { bottom: 15%; right: 3%; }
        .ascii-deco-3 { top: 60%; left: 1%; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            line-height: 1.5;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .animate-fade { animation: fadeIn 0.4s ease forwards; }
        .stagger-1 { animation-delay: 0.05s; opacity: 0; }
        .stagger-2 { animation-delay: 0.1s; opacity: 0; }
        .stagger-3 { animation-delay: 0.15s; opacity: 0; }
        .stagger-4 { animation-delay: 0.2s; opacity: 0; }
        .stagger-5 { animation-delay: 0.25s; opacity: 0; }
        
        /* Layout */
        .app-layout { display: flex; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar {
            width: 76px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }
        
        .sidebar-logo {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            box-shadow: var(--shadow-glow);
            animation: float 3s ease-in-out infinite;
        }
        
        .sidebar-logo svg { width: 28px; height: 28px; fill: white; }
        
        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            padding: 0 10px;
        }
        
        .nav-item {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            color: var(--text-secondary);
            background: transparent;
            border: none;
            position: relative;
        }
        
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; transition: all var(--transition); }
        
        .nav-item:hover {
            background: var(--border);
            color: var(--text-primary);
            transform: scale(1.05);
        }
        
        .nav-item.active {
            background: var(--accent);
            color: #fff;
            box-shadow: var(--shadow-glow);
        }
        
        .nav-item.active svg { fill: white; }
        
        .nav-item-label { font-size: 9px; margin-top: 3px; font-weight: 600; }
        .nav-item-wrap { display: flex; flex-direction: column; align-items: center; }
        .sidebar-spacer { flex: 1; }
        
        .sidebar-theme {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        
        .sidebar-theme svg { width: 20px; height: 20px; fill: var(--text-secondary); }
        .sidebar-theme:hover { border-color: var(--accent-solid); transform: rotate(15deg); }
        .sidebar-theme:hover svg { fill: var(--accent-solid); }
        
        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 76px;
            padding: 28px 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: calc(100% - 76px);
            box-sizing: border-box;
        }

        @media (min-width: 1400px) {
            .main-content { max-width: 1300px; }
        }

        @media (max-width: 768px) {
            .main-content { max-width: 100%; margin-left: 0; padding: 16px 10px; padding-bottom: 90px; }
        }
        
        /* Page */
        .page { display: none; animation: fadeIn 0.3s ease forwards; }
        .page.active { display: block; }
        
        /* Header */
        .page-header { margin-bottom: 20px; }
        .page-header h1 { font-size: 26px; font-weight: 700; margin-bottom: 2px; background: var(--accent); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-header p { color: var(--text-secondary); font-size: 13px; }
        
        /* Home: Calendar Filter */
        .home-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .home-filters {
            min-width: 380px;
            flex-shrink: 0;
        }

        .home-results {
            flex: 1;
            min-width: 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .pagination-btn {
            padding: 6px 12px;
            border-radius: var(--radius-xs);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .pagination-btn:hover { border-color: var(--accent-solid); color: var(--text-primary); }
        .pagination-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        .cal-filter-wrapper {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            align-items: flex-start;
        }

        .home-calendar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            flex: 1;
        }
        
        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* Calendar nav buttons */
        .cal-nav-btns { display: flex; gap: 6px; }

        .cal-nav-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .cal-nav-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .cal-nav-btn:hover { background: var(--bg-hover); transform: scale(1.05); }

        /* Calendar */
        .home-calendar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 600;
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-day-header {
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 0;
        }

        .cal-day {
            aspect-ratio: 1;
            background: var(--bg-secondary);
            border: 1px solid transparent;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition);
            font-size: 16px;
            font-weight: 500;
        }

        .cal-day:hover { border-color: var(--accent-solid); transform: scale(1.05); }
        .cal-day.empty { background: transparent; cursor: default; }
        .cal-day.empty:hover { transform: none; }

        .cal-day.has-trip {
            background: var(--accent-soft);
            border-color: var(--accent-solid);
        }

        .cal-day.today {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            border-color: transparent;
            color: white;
            font-weight: 700;
        }

        .cal-day.today:hover { transform: scale(1.08); }

        .cal-day.selected-day {
            background: var(--accent);
            border-color: transparent;
            color: white;
            transform: scale(1.05);
        }

        .cal-day-number { font-size: 12px; font-weight: 500; }
        .cal-day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent-solid); margin-top: 2px; }

        /* Home: Country Filter */
        .country-filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 120px;
        }

        .country-filter-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .country-btn {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }

        .country-btn:hover { border-color: var(--accent-solid); color: var(--text-primary); }
        .country-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }

        /* Search */
        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .search-box svg { width: 16px; height: 16px; fill: var(--text-muted); }
        
        .search-input {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        
        .search-input::placeholder { color: var(--text-muted); }
        
        /* Trip Cards */
        .trip-list { display: grid; gap: 12px; }
        
        .trip-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .trip-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
            opacity: 0;
            transition: opacity var(--transition);
        }
        
        .trip-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        
        .trip-card:hover::before { opacity: 1; }
        
        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        
        .trip-info { flex: 1; }
        .trip-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .trip-date { font-size: 12px; color: var(--text-secondary); }
        .trip-location-badge {
            background: var(--accent-soft);
            color: var(--accent-solid);
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 16px;
            font-weight: 500;
        }
        
        .trip-stats {
            display: flex;
            gap: 14px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        
        .trip-stat { display: flex; align-items: center; gap: 5px; }
        .trip-stat-icon { opacity: 0.7; }
        .trip-stat-icon svg { width: 14px; height: 14px; fill: currentColor; }
        .trip-stat-value { font-size: 13px; font-weight: 600; }
        .trip-stat-label { font-size: 11px; color: var(--text-secondary); }
        
        /* Trip Detail */
        .trip-detail { display: none; }
        .trip-detail.active { display: block; animation: fadeIn 0.35s ease forwards; }
        
        .detail-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        
        .back-btn {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            color: var(--text-primary);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }
        
        .back-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .back-btn:hover { border-color: var(--accent-solid); transform: scale(1.05); }
        .detail-title { font-size: 20px; font-weight: 700; }
        .detail-meta { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
            text-align: center;
            transition: all var(--transition);
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .stat-card:hover { border-color: var(--accent-solid); transform: translateY(-2px); }
        .stat-icon { margin-bottom: 4px; }
        .stat-icon svg { width: 22px; height: 22px; fill: currentColor; }
        .stat-value { font-size: 20px; font-weight: 700; }
        .stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        
        /* Map Container */
        .map-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 18px;
            animation: fadeIn 0.4s ease forwards;
        }
        
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .map-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .map-title svg { width: 16px; height: 16px; fill: var(--accent-solid); }
        
        .map-toggle {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }
        
        .map-toggle:hover { filter: brightness(1.1); transform: scale(1.02); }
        
        #map, #fullMap {
            height: 320px;
            border-radius: var(--radius-sm);
            z-index: 1;
        }
        
        #fullMap { height: calc(100vh - 160px); min-height: 400px; }
        
        /* Places */
        .section-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .section-title svg { width: 16px; height: 16px; fill: var(--accent-solid); }
        
        .place-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            margin-bottom: 18px;
        }
        
        .place-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all var(--transition);
        }
        
        .place-item:hover { border-color: var(--border-hover); transform: scale(1.02); }
        .place-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .place-icon svg { width: 16px; height: 16px; fill: currentColor; }
        
        .place-name { font-size: 12px; font-weight: 500; }
        .place-time { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
        
        /* Charts */
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
        
        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
        }
        
        .chart-card-title { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .chart-card-title svg { width: 14px; height: 14px; fill: currentColor; }
        .chart-container { height: 180px; position: relative; }
        
        /* Expense List */
        .expense-list { margin-bottom: 16px; }
        
        .expense-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all var(--transition);
            opacity: 0;
            animation: fadeIn 0.3s ease forwards;
        }
        
        .expense-item:hover { border-color: var(--border-hover); transform: translateX(3px); }
        
        .expense-left { display: flex; align-items: center; gap: 10px; }
        
        .expense-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-secondary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        
        .expense-icon svg { width: 18px; height: 18px; fill: currentColor; }
        .expense-item:hover .expense-icon { transform: scale(1.1); }
        .expense-info .name { font-size: 13px; font-weight: 500; }
        .expense-info .meta { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
        .expense-amount { font-size: 15px; font-weight: 700; color: var(--accent-red); }
        
        /* Map Page */
        .map-info-bar {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .map-info-bar span { color: var(--text-primary); font-weight: 600; }

        .map-legend {
            display: flex;
            gap: 16px;
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .map-legend #mapPlaceCount,
        .map-legend #mapTripCount {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .legend-divider {
            width: 1px;
            height: 16px;
            background: var(--border);
        }

        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

        /* Photos Page */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        
        .photo-item {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .photo-item:hover { transform: scale(1.03); box-shadow: var(--shadow); }
        .photo-placeholder { color: var(--text-muted); font-size: 42px; opacity: 0.4; }
        .photo-add { border: 2px dashed var(--border); background: transparent; }
        .photo-add:hover { border-color: var(--accent-solid); background: var(--accent-soft); }
        .photo-add svg { width: 28px; height: 28px; fill: var(--text-muted); }
        
        /* Settings */
        .settings-group { margin-bottom: 20px; }
        
        .settings-title {
            font-size: 10px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .settings-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all var(--transition);
        }
        
        .settings-item:hover { border-color: var(--border-hover); transform: translateX(3px); }
        .settings-item-left { display: flex; align-items: center; gap: 12px; }
        .settings-item-icon { }
        .settings-item-icon svg { width: 18px; height: 18px; fill: currentColor; }
        .settings-item-label { font-size: 14px; }
        .settings-item-desc { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
        
        /* Toggle */
        .toggle {
            width: 46px;
            height: 26px;
            background: var(--bg-secondary);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: background var(--transition);
        }
        
        .toggle.active { background: var(--accent-solid); }
        
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform var(--transition);
        }
        
        .toggle.active::after { transform: translateX(20px); }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state-icon { margin-bottom: 12px; opacity: 0.4; }
        .empty-state-icon svg { width: 48px; height: 48px; fill: currentColor; }
        .empty-state-text { font-size: 13px; }
        
        /* Mobile Nav */
        .mobile-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 18, 48, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--border);
            padding: 6px 8px 10px;
            z-index: 100;
        }
        
        .mobile-nav-inner { display: flex; justify-content: space-around; }
        
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 8px 12px;
            border-radius: 14px;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 10px;
            font-weight: 500;
            transition: all var(--transition);
            border: none;
            background: none;
            min-width: 56px;
        }
        
        .mobile-nav-item svg { width: 22px; height: 22px; fill: currentColor; }
        
        .mobile-nav-item.active {
            color: var(--accent-solid);
            background: var(--accent-soft);
        }
        
        /* Leaflet Dark Theme */
        .leaflet-popup-content-wrapper { 
            background: var(--bg-card) !important; 
            color: var(--text-primary) !important; 
            border-radius: 12px !important; 
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow) !important;
        }
        .leaflet-popup-tip { background: var(--bg-card) !important; }
        .leaflet-popup-content { margin: 10px 12px !important; }
        .leaflet-popup-content b { font-size: 12px; }
        .leaflet-popup-content span { font-size: 10px; color: var(--text-secondary); }
        .leaflet-control-zoom a { 
            background: var(--bg-card) !important; 
            color: var(--text-primary) !important; 
            border-color: var(--border) !important; 
        }
        .leaflet-control-zoom a:hover { background: var(--bg-card-hover) !important; }
        .leaflet-control-attribution { 
            background: rgba(15, 10, 30, 0.85) !important; 
            color: var(--text-muted) !important; 
            font-size: 9px; 
        }
        .leaflet-control-attribution a { color: var(--text-secondary) !important; }
        
        .custom-marker { background: none !important; border: none !important; }
        
        /* Timeline */
        .timeline-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 18px;
            position: relative;
        }
        
        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .timeline-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .timeline-title svg { width: 16px; height: 16px; fill: var(--accent-purple); }
        
        .timeline {
            position: relative;
            padding-left: 24px;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, var(--accent-purple), var(--accent-blue), var(--accent-pink));
            border-radius: 2px;
        }
        
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
            padding-left: 20px;
        }
        
        .timeline-item:last-child { padding-bottom: 0; }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 4px;
            width: 16px;
            height: 16px;
            background: var(--bg-card);
            border: 3px solid var(--accent-purple);
            border-radius: 50%;
            z-index: 1;
        }
        
        .timeline-item.food::before { border-color: var(--accent-orange); }
        .timeline-item.transport::before { border-color: var(--accent-blue); }
        .timeline-item.leisure::before { border-color: var(--accent-green); }
        .timeline-item.shopping::before { border-color: var(--accent-pink); }
        
        .timeline-time {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent-solid);
            margin-bottom: 4px;
        }
        
        .timeline-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .timeline-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .timeline-icon svg { width: 16px; height: 16px; fill: currentColor; }
        
        .timeline-info { flex: 1; min-width: 0; }
        .timeline-name { font-size: 13px; font-weight: 500; }
        .timeline-meta { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        
        .timeline-rating {
            display: flex;
            gap: 2px;
        }
        
        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: var(--text-muted);
            transition: all 0.15s;
        }
        
        .star-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .star-btn.filled { color: var(--accent-yellow); }
        .star-btn:hover { transform: scale(1.2); }
        
        /* Weather Widget */
        .weather-widget {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            color: white;
        }
        
        .weather-icon { font-size: 36px; }
        .weather-icon svg { width: 48px; height: 48px; fill: white; }
        
        .weather-info { flex: 1; }
        .weather-location { font-size: 12px; opacity: 0.9; }
        .weather-temp { font-size: 28px; font-weight: 700; }
        .weather-desc { font-size: 11px; opacity: 0.85; }
        
        .weather-loading { flex: 1; font-size: 13px; opacity: 0.8; }
        
        /* Photo Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .lightbox.active { display: flex; }
        
        .lightbox-img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: var(--radius-sm);
            object-fit: contain;
        }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: var(--bg-card);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }
        
        .lightbox-close svg { width: 24px; height: 24px; fill: white; }
        .lightbox-close:hover { background: var(--accent-solid); transform: scale(1.1); }
        
        .lightbox-delete {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            font-size: 13px;
            transition: all var(--transition);
        }
        
        .lightbox-delete:hover { background: #ff4444; transform: scale(1.05); }
        
        /* Photo item delete btn */
        .photo-delete {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: rgba(255, 107, 107, 0.9);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .photo-delete svg { width: 12px; height: 12px; fill: white; }
        .photo-item:hover .photo-delete { display: flex; }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
        }
        
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 16px 10px; padding-bottom: 90px; max-width: 100%; }
            .mobile-nav { display: block; }
            .page-header h1 { font-size: 22px; }
            .home-layout { flex-direction: column; }
            .home-filters { min-width: unset; width: 100%; }
            .cal-filter-wrapper { flex-direction: column; width: 100%; }
            .country-filter { flex-direction: row; flex-wrap: wrap; min-width: unset; width: 100%; }
            .country-filter-title { width: 100%; margin-bottom: 8px; }
            .home-calendar { padding: 12px 6px; width: 100%; }
            .cal-grid { gap: 2px; }
            .cal-day { font-size: 13px; width: 100%; aspect-ratio: 1; }
            .cal-day-header { font-size: 10px; padding: 4px 0; }
            .trip-card { padding: 16px 14px; width: 100%; box-sizing: border-box; }
            .trip-title { font-size: 16px; }
            .search-box { width: 100%; }
            
            @media (max-width: 480px) {
                .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
                .stat-value { font-size: 18px; }
                .place-list { grid-template-columns: 1fr; }
                .photo-grid { grid-template-columns: repeat(3, 1fr); }
                #fullMap { height: calc(100vh - 120px); min-height: 350px; }
                .trip-card { padding: 14px 12px; }
                .trip-title { font-size: 14px; }
                #map { height: 240px; }
            }
        }
    </style>
</head>

            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll(`[data-page="${pageId}"]`).forEach(n => n.classList.add('active'));
            
            if (pageId !== 'home' && currentTrip) {
                document.getElementById('tripDetail').classList.remove('active');
            }
            
            if (pageId === 'map') {
                setTimeout(initFullMap, 100);
            }
            
            if (pageId === 'photos') {
                renderPhotos();
            }
        }

        document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(btn => {
            btn.addEventListener('click', () => showPage(btn.dataset.page));
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            currentTrip = null;
            document.getElementById('tripDetail').classList.remove('active');
            renderTripList();
        });

        // Home Calendar
        function renderHomeCalendar() {
            const year = currentCalMonth.getFullYear();
            const month = currentCalMonth.getMonth();
            
            const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
            document.getElementById('currentMonth').textContent = `${year}年 ${monthNames[month]}`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            let html = '<div class="cal-day-header">日</div><div class="cal-day-header">一</div><div class="cal-day-header">二</div><div class="cal-day-header">三</div><div class="cal-day-header">四</div><div class="cal-day-header">五</div><div class="cal-day-header">六</div>';
            
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="cal-day empty"></div>';
            }
            
            const tripDates = {};
            trips.forEach(t => {
                const d = t.date.substring(0, 10);
                if (!tripDates[d]) tripDates[d] = [];
                tripDates[d].push(t);
            });
            
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const hasTrip = tripDates[dateStr];
                const isToday = dateStr === todayStr;
                
                if (hasTrip) {
                    html += `<div class="cal-day has-trip${isToday ? ' today' : ''}" data-date="${dateStr}">
                        <div class="cal-day-number">${day}</div>
                        <div class="cal-day-dot"></div>
                    </div>`;
                } else {
                    html += `<div class="cal-day${isToday ? ' today' : ''}" data-date="${dateStr}"><div class="cal-day-number">${day}</div></div>`;
                }
            }
            
            document.getElementById('homeCalGrid').innerHTML = html;
            
            // Click handlers
            document.querySelectorAll('.cal-day.has-trip').forEach(day => {
                day.addEventListener('click', () => {
                    const dateStr = day.dataset.date;
                    // Highlight selected day
                    document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected-day'));
                    day.classList.add('selected-day');
                    // Filter by date (not jump to detail)
                    filterTripsByDate(dateStr);
                });
            });
        }

        function filterTripsByDate(dateStr) {
            currentDateFilter = dateStr;
            let filtered = trips.filter(t => t.date.startsWith(dateStr));
            if (currentCountry !== 'all') {
                filtered = filtered.filter(t => t.location === currentCountry);
            }
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(t =>
                    t.name.toLowerCase().includes(search) ||
                    t.location.toLowerCase().includes(search)
                );
            }
            renderTripList(filtered);
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentCalMonth.setMonth(currentCalMonth.getMonth() - 1);
            renderHomeCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentCalMonth.setMonth(currentCalMonth.getMonth() + 1);
            renderHomeCalendar();
        });

        // Destination Filter
        let currentCountry = 'all';
        let currentDateFilter = null;

        function filterTrips() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = trips;

            if (currentCountry !== 'all') {
                filtered = filtered.filter(t => t.location === currentCountry);
            }

            if (currentDateFilter) {
                filtered = filtered.filter(t => t.date.startsWith(currentDateFilter));
            }

            if (search) {
                filtered = filtered.filter(t =>
                    t.name.toLowerCase().includes(search) ||
                    t.location.toLowerCase().includes(search)
                );
            }

            renderTripList(filtered);
        }

        document.querySelectorAll('.country-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                currentCountry = btn.dataset.country;
                document.querySelectorAll('.country-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDateFilter = null;
                document.querySelectorAll('.cal-day').forEach(d => d.classList.remove('selected-day'));
                filterTrips();
            });
        });

        document.getElementById('searchInput').addEventListener('input', () => filterTrips());

        const ITEMS_PER_PAGE = 10;
        let currentPage = 1;
        let filteredTrips = trips;

        function renderTripList(tripData = trips) {
            const container = document.getElementById('tripList');
            filteredTrips = tripData;

            if (tripData.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">${icons.empty}</div><div class="empty-state-text">沒有找到旅程記錄</div></div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            currentPage = 1;
            renderPaginatedTrips();
            renderPagination();
        }

        function renderPaginatedTrips() {
            const container = document.getElementById('tripList');
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageTrips = filteredTrips.slice(start, end);

            container.innerHTML = pageTrips.map((trip, i) => {
                const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
                return `
                    <div class="trip-card stagger-${Math.min(i + 1, 5)}" data-id="${trip.id}">
                        <div class="trip-header">
                            <div class="trip-info">
                                <div class="trip-title">${trip.name}</div>
                                <div class="trip-date">${trip.date}</div>
                            </div>
                            <div class="trip-location-badge">${trip.location}</div>
                        </div>
                        <div class="trip-stats">
                            <div class="trip-stat">
                                <span class="trip-stat-icon">${icons.location}</span>
                                <span class="trip-stat-value">${trip.places.length}</span>
                                <span class="trip-stat-label">地點</span>
                            </div>
                            <div class="trip-stat">
                                <span class="trip-stat-icon">${icons.money}</span>
                                <span class="trip-stat-value">$${total.toFixed(0)}</span>
                                <span class="trip-stat-label">消費</span>
                            </div>
                        </div>
                    </div>`;
            });

            // Click handlers
            document.querySelectorAll('.trip-card').forEach(card => {
                card.addEventListener('click', () => showTripDetail(parseInt(card.dataset.id)));
            });
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredTrips.length / ITEMS_PER_PAGE);
            const container = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="pagination-btn${i === currentPage ? ' active' : ''}" data-page="${i}">${i}</button>`;
            }
            container.innerHTML = html;

            container.querySelectorAll('.pagination-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentPage = parseInt(btn.dataset.page);
                    renderPaginatedTrips();
                    renderPagination();
                });
            });
        }

        // Trip Detail
        function showTripDetail(tripId) {
            const trip = trips.find(t => t.id === tripId);
            if (!trip) return;
            currentTrip = trip;

            document.getElementById('detailTitle').textContent = trip.name;
            document.getElementById('detailMeta').textContent = `${trip.date} · ${trip.location}`;

            // Stats
            const total = trip.expenses.reduce((s, e) => s + e.amount, 0);
            const statsHtml = `
                <div class="stat-card stagger-1">
                    <div class="stat-icon" style="color: var(--accent-blue)">${icons.location}</div>
                    <div class="stat-value">${trip.places.length}</div>
                    <div class="stat-label">行程地點</div>
                </div>
                <div class="stat-card stagger-2">
                    <div class="stat-icon" style="color: var(--accent-orange)">${icons.food}</div>
                    <div class="stat-value">${trip.expenses.filter(e => e.category === '餐飲').length}</div>
                    <div class="stat-label">餐飲消費</div>
                </div>
                <div class="stat-card stagger-3">
                    <div class="stat-icon" style="color: var(--accent-green)">${icons.leisure}</div>
                    <div class="stat-value">${trip.expenses.filter(e => e.category === '休閒').length}</div>
                    <div class="stat-label">休閒活動</div>
                </div>
                <div class="stat-card stagger-4">
                    <div class="stat-icon" style="color: var(--accent-red)">${icons.money}</div>
                    <div class="stat-value">$${total.toFixed(0)}</div>
                    <div class="stat-label">總消費</div>
                </div>
            `;
            document.getElementById('statsGrid').innerHTML = statsHtml;

            // Weather
            fetchWeather(trip.location);
            
            // Timeline
            renderTimeline(trip);

            // Places
            document.getElementById('placeList').innerHTML = trip.places.map(p => `
                <div class="place-item">
                    <div class="place-icon" style="color: ${typeColors[p.type]}">${getIcon(p.type)}</div>
                    <div>
                        <div class="place-name">${p.name}</div>
                        <div class="place-time">${p.time}</div>
                    </div>
                </div>
            `).join('');

            // Charts
            renderDetailCharts(trip);

            // Expenses
            document.getElementById('expenseList').innerHTML = trip.expenses.map((e, i) => `
                <div class="expense-item stagger-${Math.min(i + 1, 5)}">
                    <div class="expense-left">
                        <div class="expense-icon" style="color: ${typeColors[e.category === '交通' ? 'transport' : e.category === '餐飲' ? 'food' : e.category === '休閒' ? 'leisure' : 'shopping']}">${getIcon(e.category === '交通' ? 'transport' : e.category === '餐飲' ? 'food' : e.category === '休閒' ? 'leisure' : 'shopping')}</div>
                        <div class="expense-info">
                            <div class="name">${e.name}</div>
                            <div class="meta">${e.time} · ${e.category}</div>
                        </div>
                    </div>
                    <div class="expense-amount">-$${e.amount.toFixed(2)}</div>
                </div>
            `).join('');

            document.getElementById('tripDetail').classList.add('active');
            document.getElementById('page-home').classList.remove('active');

            // Init map
            setTimeout(initTripMap, 100);
        }
        
        // Weather
        function fetchWeather(location) {
            const widget = document.getElementById('weatherWidget');
            const cityMap = { '深圳': 'Shenzhen', '香港': 'Hong+Kong', '澳門': 'Macau', '台灣': 'Taipei', '日本': 'Tokyo' };
            const city = cityMap[location] || location;
            
            fetch(`https://wttr.in/${city}?format=j1`)
                .then(r => r.json())
                .then(data => {
                    const current = data.current_condition[0];
                    const temp = current.temp_C + '°C';
                    const desc = current.weatherDesc[0].value;
                    const icon = getWeatherIcon(current.weatherCode);
                    widget.innerHTML = `
                        <div class="weather-icon">${icon}</div>
                        <div class="weather-info">
                            <div class="weather-location">${location}</div>
                            <div class="weather-temp">${temp}</div>
                            <div class="weather-desc">${desc}</div>
                        </div>
                    `;
                })
                .catch(() => {
                    widget.innerHTML = `
                        <div class="weather-icon">${icons.empty}</div>
                        <div class="weather-info">
                            <div class="weather-location">${location}</div>
                            <div class="weather-temp">--°C</div>
                            <div class="weather-desc">天氣資訊暫不可用</div>
                        </div>
                    `;
                });
        }
        
        function getWeatherIcon(code) {
            const icons2 = {
                '113': '<svg viewBox="0 0 24 24" style="fill:white"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>',
                '116': '<svg viewBox="0 0 24 24" style="fill:white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>',
                '119': '<svg viewBox="0 0 24 24" style="fill:white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3z"/></svg>',
                '143': '<svg viewBox="0 0 24 24" style="fill:white"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>'
            };
            return icons2[code] || icons2['116'];
        }
        
        // Timeline
        function renderTimeline(trip) {
            const container = document.getElementById('timeline');
            const ratings = JSON.parse(localStorage.getItem('placeRatings')) || {};
            
            container.innerHTML = trip.places.map((p, i) => {
                const placeId = `${trip.id}-${i}`;
                const rating = ratings[placeId] || 0;
                return `
                    <div class="timeline-item ${p.type}">
                        <div class="timeline-time">${p.time}</div>
                        <div class="timeline-content">
                            <div class="timeline-icon" style="background: ${typeColors[p.type]}20; color: ${typeColors[p.type]}">${getIcon(p.type)}</div>
                            <div class="timeline-info">
                                <div class="timeline-name">${p.name}</div>
                                <div class="timeline-meta">${typeLabels[p.type]}</div>
                            </div>
                            <div class="timeline-rating" data-place="${placeId}">
                                ${[1,2,3,4,5].map(n => `
                                    <button class="star-btn ${n <= rating ? 'filled' : ''}" data-rating="${n}">
                                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Star rating handlers
            container.querySelectorAll('.star-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const placeId = btn.closest('.timeline-rating').dataset.place;
                    const newRating = parseInt(btn.dataset.rating);
                    ratings[placeId] = newRating;
                    localStorage.setItem('placeRatings', JSON.stringify(ratings));
                    // Update UI
                    btn.closest('.timeline-rating').querySelectorAll('.star-btn').forEach(b => {
                        b.classList.toggle('filled', parseInt(b.dataset.rating) <= newRating);
                    });
                });
            });
        }

        function renderDetailCharts(trip) {
            const ctx1 = document.getElementById('detailPieChart').getContext('2d');
            const ctx2 = document.getElementById('detailBarChart').getContext('2d');

            if (detailPieChart) detailPieChart.destroy();
            if (detailBarChart) detailBarChart.destroy();

            const categories = {};
            trip.expenses.forEach(e => {
                categories[e.category] = (categories[e.category] || 0) + e.amount;
            });

            detailPieChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(categories),
                    datasets: [{
                        data: Object.values(categories),
                        backgroundColor: ['#3b82f6', '#ffa94d', '#69db7c', '#da77f2'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#b8a9d4', boxWidth: 12, padding: 8 } } } }
            });

            detailBarChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: trip.expenses.map(e => e.name.length > 10 ? e.name.substring(0, 10) + '...' : e.name),
                    datasets: [{
                        data: trip.expenses.map(e => e.amount),
                        backgroundColor: trip.expenses.map(e => {
                            if (e.category === '交通') return '#3b82f6';
                            if (e.category === '餐飲') return '#ffa94d';
                            if (e.category === '休閒') return '#69db7c';
                            return '#da77f2';
                        }),
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#b8a9d4', font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#b8a9d4' }, grid: { color: 'rgba(255,255,255,0.05)' } } } }
            });
        }

        // Map
        function initTripMap() {
            if (!currentTrip || tripMap) return;
            tripMap = L.map('map').setView([22.5, 113.93], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(tripMap);

            currentTrip.places.forEach(p => {
                const color = typeColors[p.type];
                const icon = L.divIcon({ className: 'custom-marker', html: `<div style="width:24px;height:24px;background:${color};border-radius:50%;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>`, iconSize: [24, 24] });
                L.marker([p.lat, p.lng], { icon }).addTo(tripMap).bindPopup(`<b>${p.name}</b><br><span>${p.time}</span>`);
            });
        }

        function initFullMap() {
            if (fullMap) return;
            fullMap = L.map('fullMap').setView([22.5, 113.93], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(fullMap);

            document.getElementById('mapPlaceCount').textContent = `共 ${trips.reduce((s, t) => s + t.places.length, 0)} 個地點`;
            document.getElementById('mapTripCount').textContent = `${trips.length} 個旅程`;

            trips.forEach(trip => {
                trip.places.forEach(p => {
                    const color = typeColors[p.type];
                    const icon = L.divIcon({ className: 'custom-marker', html: `<div style="width:16px;height:16px;background:${color};border-radius:50%;border:2px solid white"></div>`, iconSize: [16, 16] });
                    L.marker([p.lat, p.lng], { icon }).addTo(fullMap).bindPopup(`<b>${trip.name}</b><br>${p.name}<br><span>${p.time}</span>`);
                });
            });
        }

        document.getElementById('mapToggle').addEventListener('click', () => {
            const wrapper = document.getElementById('mapWrapper');
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                document.getElementById('mapToggle').textContent = '收合';
                setTimeout(() => { if (tripMap) tripMap.invalidateSize(); }, 100);
            } else {
                wrapper.style.display = 'none';
                document.getElementById('mapToggle').textContent = '展開';
            }
        });

        // Photos
        let lightboxIndex = null;
        
        function renderPhotos() {
            const grid = document.getElementById('photoGrid');
            const empty = document.getElementById('photoEmpty');
            
            if (photos.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                grid.innerHTML = photos.map((p, i) => `
                    <div class="photo-item" data-index="${i}">
                        <button class="photo-delete" data-index="${i}">
                            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                        </button>
                        <img src="${p}" style="width:100%;height:100%;object-fit:cover">
                    </div>
                `).join('') + `<div class="photo-item photo-add" id="addPhoto"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>`;
            }
            
            // Photo click for lightbox
            grid.querySelectorAll('.photo-item:not(.photo-add)').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.photo-delete')) return;
                    lightboxIndex = parseInt(item.dataset.index);
                    document.getElementById('lightboxImg').src = photos[lightboxIndex];
                    document.getElementById('lightbox').classList.add('active');
                });
            });
            
            // Delete button handler
            grid.querySelectorAll('.photo-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    photos.splice(idx, 1);
                    localStorage.setItem('travelPhotos', JSON.stringify(photos));
                    renderPhotos();
                });
            });
        }

        document.getElementById('addPhoto').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        photos.push(ev.target.result);
                        localStorage.setItem('travelPhotos', JSON.stringify(photos));
                        renderPhotos();
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        });
        
        // Lightbox
        document.getElementById('lightboxClose').addEventListener('click', () => {
            document.getElementById('lightbox').classList.remove('active');
            lightboxIndex = null;
        });
        
        document.getElementById('lightboxDelete').addEventListener('click', () => {
            if (lightboxIndex !== null) {
                photos.splice(lightboxIndex, 1);
                localStorage.setItem('travelPhotos', JSON.stringify(photos));
                renderPhotos();
                document.getElementById('lightbox').classList.remove('active');
                lightboxIndex = null;
            }
        });

        // Export/Import
        document.getElementById('exportBtn').addEventListener('click', () => {
            const data = { trips, photos, version: 1 };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `mkit-travelling-backup-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
        });

        document.getElementById('importBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.trips) {
                                trips = data.trips;
                                localStorage.setItem('travelTrips', JSON.stringify(trips));
                            }
                            if (data.photos) {
                                photos = data.photos;
                                localStorage.setItem('travelPhotos', JSON.stringify(photos));
                            }
                            location.reload();
                        } catch (err) {
                            alert('無效的備份檔案');
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        });

        // Init
        renderHomeCalendar();
        renderTripList();
        setTheme(isDark);
        
        // p5.js Animated Background
        new p5((p) => {
            let particles = [];
            const PARTICLE_COUNT = 25;
            
            p.setup = () => {
                const canvas = p.createCanvas(p.windowWidth, p.windowHeight);
                canvas.parent('p5-canvas');
                canvas.id('p5-canvas');
                canvas.style('position', 'fixed');
                canvas.style('top', '0');
                canvas.style('left', '0');
                canvas.style('z-index', '0');
                canvas.style('pointer-events', 'none');
                canvas.style('opacity', '0.35');
                
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    particles.push({
                        x: p.random(p.width),
                        y: p.random(p.height),
                        vx: p.random(-0.3, 0.3),
                        vy: p.random(-0.3, 0.3),
                        size: p.random(3, 8),
                        hue: p.random([280, 320, 200, 30, 180]) // purple, pink, blue, orange, green
                    });
                }
                p.noStroke();
            };
            
            p.draw = () => {
                p.clear();
                particles.forEach(pt => {
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    
                    // Wrap around edges
                    if (pt.x < 0) pt.x = p.width;
                    if (pt.x > p.width) pt.x = 0;
                    if (pt.y < 0) pt.y = p.height;
                    if (pt.y > p.height) pt.y = 0;
                    
                    const colors = {
                        280: [218, 119, 242], // purple
                        320: [247, 131, 172], // pink
                        200: [77, 171, 247],   // blue
                        30:  [255, 169, 77],   // orange
                        180: [105, 219, 124]   // green
                    };
                    const c = colors[pt.hue] || colors[280];
                    p.fill(c[0], c[1], c[2], 60);
                    p.ellipse(pt.x, pt.y, pt.size * 2);
                    
                    // Glow effect
                    p.fill(c[0], c[1], c[2], 20);
                    p.ellipse(pt.x, pt.y, pt.size * 4);
                });
            };
            
            p.windowResized = () => {
                p.resizeCanvas(p.windowWidth, p.windowHeight);
            };
        });
    </script>
</html>
