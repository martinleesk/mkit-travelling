<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦵 旅行足迹檔案</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 16px;
            padding-bottom: 100px;
        }

        /* Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        .header .subtitle {
            color: #94a3b8;
            font-size: 12px;
        }

        /* Trip Selector */
        .trip-selector {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .trip-selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .trip-selector-title {
            font-size: 13px;
            color: #94a3b8;
        }
        .add-trip-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .add-trip-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .trip-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            -webkit-overflow-scrolling: touch;
        }
        .trip-tab {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            color: #94a3b8;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .trip-tab:hover {
            background: rgba(255,255,255,0.12);
        }
        .trip-tab.active {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }
        .trip-tab .trip-delete {
            margin-left: 5px;
            opacity: 0.6;
            font-size: 11px;
        }
        .trip-tab .trip-delete:hover {
            opacity: 1;
        }

        /* Search Bar */
        .search-bar {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #64748b;
        }
        .search-icon {
            color: #64748b;
            font-size: 18px;
        }

        /* Filter Pills */
        .filter-section {
            margin-bottom: 15px;
        }
        .filter-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
            padding-left: 5px;
        }
        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-pill {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }
        .filter-pill:hover {
            background: rgba(255,255,255,0.12);
        }
        .filter-pill.active {
            background: #10b981;
            border-color: #10b981;
            color: #fff;
        }
        .filter-pill:active {
            transform: scale(0.95);
        }

        /* Summary Card */
        .summary-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .summary-card.hidden {
            display: none;
        }
        .total-amount {
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            color: #10b981;
        }
        .total-label {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 3px;
        }
        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .category-item {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }
        .category-item .icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .category-item .amount {
            font-size: 15px;
            font-weight: bold;
        }
        .category-item .label {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Charts Section */
        .charts-section {
            margin-bottom: 20px;
        }
        .chart-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .chart-title {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
        }
        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Map Section */
        .map-section {
            margin-bottom: 20px;
        }
        .map-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .map-title {
            font-size: 14px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .map-toggle {
            background: rgba(16,185,129,0.2);
            color: #10b981;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .map-toggle:hover {
            background: rgba(16,185,129,0.3);
        }
        #map {
            height: 250px;
            border-radius: 12px;
            z-index: 1;
        }
        .leaflet-popup-content-wrapper {
            background: #1a1a2e;
            color: #fff;
            border-radius: 12px;
        }
        .leaflet-popup-tip {
            background: #1a1a2e;
        }
        .popup-content {
            padding: 5px;
        }
        .popup-content h4 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #10b981;
        }
        .popup-content p {
            font-size: 12px;
            color: #94a3b8;
            margin: 2px 0;
        }

        /* Section Title */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title.hidden {
            display: none;
        }

        /* Trip Cards */
        .trip-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            touch-action: manipulation;
            cursor: pointer;
        }
        .trip-card:active {
            transform: scale(0.98);
            transition: transform 0.1s;
        }
        .trip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .trip-date {
            font-size: 12px;
            color: #64748b;
        }
        .trip-location {
            background: rgba(16,185,129,0.2);
            color: #10b981;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
        }
        .trip-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .trip-expenses {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .expense-tag {
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 5px 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .expense-tag .amount {
            color: #f87171;
            font-weight: 600;
        }

        /* All Expenses Section */
        .all-expenses-section {
            margin-top: 20px;
        }
        .expense-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .expense-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .expense-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .expense-info .name {
            font-size: 14px;
            font-weight: 500;
        }
        .expense-info .trip-name {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }
        .expense-amount {
            font-size: 15px;
            font-weight: bold;
            color: #f87171;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-state.hidden {
            display: none;
        }

        /* Add Trip Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .modal h3 {
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-input {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        .modal-input:focus {
            border-color: #10b981;
        }
        .modal-select {
            width: 100%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        .modal-select option {
            background: #1a1a2e;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .modal-btn.cancel {
            background: rgba(255,255,255,0.08);
            color: #94a3b8;
        }
        .modal-btn.confirm {
            background: #10b981;
            color: #fff;
        }
        .modal-btn:hover {
            transform: scale(1.02);
        }

        /* Mobile Optimizations */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
            .total-amount {
                font-size: 32px;
            }
            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .chart-row {
                grid-template-columns: 1fr;
            }
            .chart-container {
                height: 180px;
            }
            .filter-pills {
                overflow-x: auto;
                flex-wrap: nowrap;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 5px;
            }
            .filter-pill {
                flex-shrink: 0;
            }
            #map {
                height: 200px;
            }
        }

        /* Smooth animations */
        .trip-card, .expense-item, .chart-card, .map-card, .trip-tab {
            transition: all 0.2s;
        }

        /* Leaflet dark theme override */
        .leaflet-control-zoom a {
            background: #1a1a2e !important;
            color: #fff !important;
            border-color: rgba(255,255,255,0.1) !important;
        }
        .leaflet-control-zoom a:hover {
            background: #16213e !important;
        }
        .leaflet-control-attribution {
            background: rgba(26,26,46,0.8) !important;
            color: #64748b !important;
        }
        .leaflet-control-attribution a {
            color: #10b981 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🦵 旅行足迹檔案</h1>
            <div class="subtitle" id="tripCount">1個旅程 · 總消費 HK$0</div>
        </div>

        <!-- Trip Selector -->
        <div class="trip-selector">
            <div class="trip-selector-header">
                <div class="trip-selector-title">📍 切換旅程</div>
                <button class="add-trip-btn" id="addTripBtn">
                    <span>＋</span> 新旅程
                </button>
            </div>
            <div class="trip-tabs" id="tripTabs">
                <!-- Trip tabs will be rendered here -->
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜尋餐廳、地點...">
        </div>

        <!-- Filter Pills -->
        <div class="filter-section">
            <div class="filter-label">地區</div>
            <div class="filter-pills" id="locationFilters">
                <div class="filter-pill active" data-value="all">全部</div>
                <div class="filter-pill" data-value="深圳">🇨🇳 深圳</div>
                <div class="filter-pill" data-value="香港">🇭🇰 香港</div>
                <div class="filter-pill" data-value="澳門">🇲🇴 澳門</div>
                <div class="filter-pill" data-value="台灣">🇹🇼 台灣</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-label">類別</div>
            <div class="filter-pills" id="categoryFilters">
                <div class="filter-pill active" data-value="all">全部</div>
                <div class="filter-pill" data-value="交通">🚌 交通</div>
                <div class="filter-pill" data-value="餐飲">🍽️ 餐飲</div>
                <div class="filter-pill" data-value="休閒">💆 休閒</div>
                <div class="filter-pill" data-value="購物">🛍️ 購物</div>
            </div>
        </div>

        <!-- Summary Card -->
        <div class="summary-card" id="summaryCard">
            <div class="total-amount" id="totalAmount">HK$0.00</div>
            <div class="total-label">總消費</div>
            <div class="category-grid">
                <div class="category-item">
                    <div class="icon">🚌</div>
                    <div class="amount" id="catTransport">$0</div>
                    <div class="label">交通</div>
                </div>
                <div class="category-item">
                    <div class="icon">🍽️</div>
                    <div class="amount" id="catFood">$0</div>
                    <div class="label">餐飲</div>
                </div>
                <div class="category-item">
                    <div class="icon">💆</div>
                    <div class="amount" id="catLeisure">$0</div>
                    <div class="label">休閒</div>
                </div>
                <div class="category-item">
                    <div class="icon">🛍️</div>
                    <div class="amount" id="catShopping">$0</div>
                    <div class="label">購物</div>
                </div>
            </div>
        </div>

        <!-- Map Section -->
        <div class="map-section">
            <div class="map-card">
                <div class="map-header">
                    <div class="map-title">🗺️ 足迹地圖</div>
                    <button class="map-toggle" id="mapToggle">展開地圖</button>
                </div>
                <div id="mapWrapper" style="display:none;">
                    <div id="map"></div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="charts-section" id="chartsSection">
            <div class="chart-row">
                <div class="chart-card">
                    <div class="chart-title">📊 消費分佈</div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>
                <div class="chart-card">
                    <div class="chart-title">📈 類別比較</div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trip Section -->
        <div id="tripSectionTitle" class="section-title">📍 行程記錄</div>
        <div id="tripList"></div>

        <!-- All Expenses Section -->
        <div class="all-expenses-section" id="expenseSectionTitle">
            <div class="section-title">💸 消費明細</div>
            <div id="allExpensesList"></div>
        </div>

        <!-- Empty State -->
        <div class="empty-state hidden" id="emptyState">
            <div class="icon">🔍</div>
            <div>找不到相關消費記錄</div>
        </div>
    </div>

    <!-- Add Trip Modal -->
    <div class="modal-overlay hidden" id="addTripModal">
        <div class="modal">
            <h3>🧳 新旅程</h3>
            <input type="text" class="modal-input" id="newTripName" placeholder="旅程名稱 (例如：澳門美食之旅)">
            <input type="date" class="modal-input" id="newTripDate">
            <select class="modal-select" id="newTripLocation">
                <option value="深圳">🇨🇳 深圳</option>
                <option value="香港">🇭🇰 香港</option>
                <option value="澳門">🇲🇴 澳門</option>
                <option value="台灣">🇹🇼 台灣</option>
            </select>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancelTripBtn">取消</button>
                <button class="modal-btn confirm" id="confirmTripBtn">創建</button>
            </div>
        </div>
    </div>

    <script>
        // Default trip data
        const defaultTrips = [
            {
                id: 1,
                name: '深圳灣一日遊',
                date: '2026-06-07',
                location: '深圳',
                center: [22.4709, 113.9295],
                places: [
                    { name: '深圳灣口岸', lat: 22.4709, lng: 113.9295, type: 'transport', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', lat: 22.4938, lng: 113.9304, type: 'leisure', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', lat: 22.4855, lng: 113.9412, type: 'food', icon: '🍽️', time: '15:52' },
                    { name: '蔡潤越南粉', lat: 22.5012, lng: 113.9283, type: 'food', icon: '🍽️', time: '20:13' }
                ],
                expenses: [
                    { name: 'ZAKC直通車（去程）', amount: 60.00, category: '交通', icon: '🚌', time: '11:50' },
                    { name: '泰适SPA馆', amount: 231.48, category: '休閒', icon: '💆', time: '14:44' },
                    { name: 'NEED創意韓國料理', amount: 231.48, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'NEED創意韓國料理（加單）', amount: 37.22, category: '餐飲', icon: '🍽️', time: '15:52' },
                    { name: 'ZAKC直通車（回程）', amount: 60.00, category: '交通', icon: '🚌', time: '16:49' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '美團餐飲團購', amount: 393.16, category: '餐飲', icon: '🍽️', time: '19:35' },
                    { name: '蔡潤越南粉', amount: 147.73, category: '餐飲', icon: '🍽️', time: '20:13' }
                ]
            }
        ];

        // Load trips from localStorage or use default
        let trips = JSON.parse(localStorage.getItem('travelTrips')) || JSON.parse(JSON.stringify(defaultTrips));
        let currentTripId = parseInt(localStorage.getItem('currentTripId')) || trips[0].id;

        // Save trips to localStorage
        function saveTrips() {
            localStorage.setItem('travelTrips', JSON.stringify(trips));
            localStorage.setItem('currentTripId', currentTripId);
        }

        // Get current trip
        function getCurrentTrip() {
            return trips.find(t => t.id === currentTripId) || trips[0];
        }

        // Get total across all trips
        function getTotalAcrossAllTrips() {
            return trips.reduce((sum, t) => {
                return sum + t.expenses.reduce((s, e) => s + e.amount, 0);
            }, 0);
        }

        // Filter state
        let currentFilters = {
            location: 'all',
            category: 'all',
            search: ''
        };

        // Chart instances
        let pieChart = null;
        let barChart = null;
        let map = null;
        let markers = [];

        // Color palette
        const colors = {
            transport: '#3b82f6',
            food: '#f97316',
            leisure: '#10b981',
            shopping: '#8b5cf6',
            other: '#64748b'
        };

        // Type colors for map markers
        const typeColors = {
            transport: '#3b82f6',
            food: '#f97316',
            leisure: '#10b981',
            shopping: '#8b5cf6'
        };

        // Location emoji map
        const locationEmoji = {
            '深圳': '🇨🇳',
            '香港': '🇭🇰',
            '澳門': '🇲🇴',
            '台灣': '🇹🇼'
        };

        // Render trip tabs
        function renderTripTabs() {
            const container = document.getElementById('tripTabs');
            container.innerHTML = trips.map(trip => `
                <div class="trip-tab ${trip.id === currentTripId ? 'active' : ''}" data-id="${trip.id}">
                    <span>${locationEmoji[trip.location] || '📍'}</span>
                    <span>${trip.name}</span>
                    <span class="trip-delete" data-id="${trip.id}">×</span>
                </div>
            `).join('');

            // Update header subtitle
            const total = getTotalAcrossAllTrips();
            document.getElementById('tripCount').textContent = `${trips.length}個旅程 · 總消費 HK$${total.toFixed(0)}`;
        }

        // Trip tab click
        document.getElementById('tripTabs').addEventListener('click', (e) => {
            const tab = e.target.closest('.trip-tab');
            const deleteBtn = e.target.closest('.trip-delete');

            if (deleteBtn) {
                e.stopPropagation();
                const id = parseInt(deleteBtn.dataset.id);
                if (trips.length > 1) {
                    trips = trips.filter(t => t.id !== id);
                    if (currentTripId === id) {
                        currentTripId = trips[0].id;
                    }
                    saveTrips();
                    renderTripTabs();
                    applyFilters();
                    updateMapMarkers();
                } else {
                    alert('起碼要有一個旅程！');
                }
                return;
            }

            if (tab) {
                currentTripId = parseInt(tab.dataset.id);
                saveTrips();
                renderTripTabs();
                applyFilters();
                updateMapMarkers();
            }
        });

        // Add trip modal
        document.getElementById('addTripBtn').addEventListener('click', () => {
            document.getElementById('addTripModal').classList.remove('hidden');
            document.getElementById('newTripName').value = '';
            document.getElementById('newTripDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('newTripName').focus();
        });

        document.getElementById('cancelTripBtn').addEventListener('click', () => {
            document.getElementById('addTripModal').classList.add('hidden');
        });

        document.getElementById('confirmTripBtn').addEventListener('click', () => {
            const name = document.getElementById('newTripName').value.trim();
            const date = document.getElementById('newTripDate').value;
            const location = document.getElementById('newTripLocation').value;

            if (!name) {
                alert('請輸入旅程名稱');
                return;
            }

            const newTrip = {
                id: Date.now(),
                name: name,
                date: date,
                location: location,
                center: [22.5, 114.0],
                places: [],
                expenses: []
            };

            trips.push(newTrip);
            currentTripId = newTrip.id;
            saveTrips();
            renderTripTabs();
            applyFilters();
            updateMapMarkers();
            document.getElementById('addTripModal').classList.add('hidden');
        });

        // Map toggle
        document.getElementById('mapToggle').addEventListener('click', function() {
            const wrapper = document.getElementById('mapWrapper');
            const btn = document.getElementById('mapToggle');
            if (wrapper.style.display === 'none') {
                wrapper.style.display = 'block';
                btn.textContent = '收合地圖';
                if (map) {
                    setTimeout(() => map.invalidateSize(), 100);
                }
            } else {
                wrapper.style.display = 'none';
                btn.textContent = '展開地圖';
            }
        });

        // Initialize map
        function initMap() {
            map = L.map('map').setView([22.4900, 113.9300], 13);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
                maxZoom: 19
            }).addTo(map);

            updateMapMarkers();
        }

        // Create custom marker icon
        function createMarkerIcon(type, icon) {
            const color = typeColors[type] || colors.other;
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    background: ${color};
                    width: 32px;
                    height: 32px;
                    border-radius: 50% 50% 50% 0;
                    transform: rotate(-45deg);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
                    border: 2px solid rgba(255,255,255,0.3);
                ">
                    <span style="transform: rotate(45deg); font-size: 14px;">${icon}</span>
                </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
        }

        // Update map markers
        function updateMapMarkers() {
            if (!map) return;

            markers.forEach(m => map.removeLayer(m));
            markers = [];

            const currentTrip = getCurrentTrip();
            const typeLabels = { transport: '交通', food: '餐飲', leisure: '休閒', shopping: '購物' };

            currentTrip.places.forEach(place => {
                const marker = L.marker([place.lat, place.lng], {
                    icon: createMarkerIcon(place.type, place.icon)
                });

                marker.bindPopup(`
                    <div class="popup-content">
                        <h4>${place.name}</h4>
                        <p>${place.icon} ${typeLabels[place.type] || '其他'}</p>
                        <p>🕐 ${place.time}</p>
                    </div>
                `);

                marker.addTo(map);
                markers.push(marker);
            });

            if (markers.length > 0) {
                const group = L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.2));
            }
        }

        // Initialize charts
        function initCharts() {
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            const barCtx = document.getElementById('barChart').getContext('2d');

            pieChart = new Chart(pieCtx, {
                type: 'doughnut',
                data: {
                    labels: ['交通', '餐飲', '休閒', '購物'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: [colors.transport, colors.food, colors.leisure, colors.shopping],
                        borderWidth: 0,
                        cutout: '65%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#94a3b8',
                                font: { size: 11 },
                                padding: 10,
                                usePointStyle: true
                            }
                        }
                    }
                }
            });

            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['交通', '餐飲', '休閒', '購物'],
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: [colors.transport, colors.food, colors.leisure, colors.shopping],
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: '#64748b', font: { size: 11 } }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#64748b', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        // Update charts
        function updateCharts(totals) {
            const data = [totals.transport, totals.food, totals.leisure, totals.shopping];

            pieChart.data.datasets[0].data = data;
            pieChart.update();

            barChart.data.datasets[0].data = data;
            barChart.update();

            const hasData = data.some(v => v > 0);
            document.getElementById('chartsSection').style.display = hasData ? 'block' : 'none';
        }

        // Filter click handlers
        document.querySelectorAll('.filter-pills').forEach(container => {
            container.addEventListener('click', (e) => {
                const pill = e.target.closest('.filter-pill');
                if (!pill) return;

                container.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
                pill.classList.add('active');

                const filterType = container.id === 'locationFilters' ? 'location' : 'category';
                const value = pill.dataset.value;

                currentFilters[filterType] = value;
                applyFilters();
            });
        });

        // Search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentFilters.search = e.target.value.toLowerCase();
            applyFilters();
        });

        function applyFilters() {
            const searchValue = currentFilters.search;

            let totalTransport = 0, totalFood = 0, totalLeisure = 0, totalOther = 0;
            let filteredTrips = [];
            let filteredExpenses = [];

            trips.forEach(trip => {
                let tripMatches = true;
                let tripExpenses = [];

                if (currentFilters.location !== "all" && trip.location !== currentFilters.location) {
                    tripMatches = false;
                }

                if (searchValue) {
                    const searchLower = searchValue.toLowerCase();
                    const nameMatch = trip.name.toLowerCase().includes(searchLower);
                    const expenseMatch = trip.expenses.some(e =>
                        e.name.toLowerCase().includes(searchLower) ||
                        e.category.toLowerCase().includes(searchLower)
                    );
                    if (!nameMatch && !expenseMatch) {
                        tripMatches = false;
                    }
                }

                if (currentFilters.category !== "all") {
                    tripExpenses = trip.expenses.filter(e => e.category === currentFilters.category);
                    if (tripExpenses.length === 0) {
                        tripMatches = false;
                    }
                } else {
                    tripExpenses = trip.expenses;
                }

                if (tripMatches) {
                    filteredTrips.push(trip);
                    trip.expenses.forEach(exp => {
                        if (currentFilters.category === "all" || exp.category === currentFilters.category) {
                            filteredExpenses.push({...exp, tripName: trip.name, tripDate: trip.date, tripLocation: trip.location});
                        }
                    });
                }
            });

            filteredExpenses.forEach(exp => {
                switch(exp.category) {
                    case "交通": totalTransport += exp.amount; break;
                    case "餐飲": totalFood += exp.amount; break;
                    case "休閒": totalLeisure += exp.amount; break;
                    default: totalOther += exp.amount;
                }
            });

            const total = totalTransport + totalFood + totalLeisure + totalOther;

            document.getElementById('totalAmount').textContent = `HK$${total.toFixed(2)}`;
            document.getElementById('catTransport').textContent = `$${totalTransport.toFixed(0)}`;
            document.getElementById('catFood').textContent = `$${totalFood.toFixed(0)}`;
            document.getElementById('catLeisure').textContent = `$${totalLeisure.toFixed(0)}`;
            document.getElementById('catShopping').textContent = `$${totalOther.toFixed(0)}`;

            updateCharts({
                transport: totalTransport,
                food: totalFood,
                leisure: totalLeisure,
                shopping: totalOther
            });

            if (filteredExpenses.length === 0) {
                document.getElementById('summaryCard').classList.add('hidden');
            } else {
                document.getElementById('summaryCard').classList.remove('hidden');
            }

            document.getElementById('tripSectionTitle').classList.toggle('hidden', filteredTrips.length === 0);
            document.getElementById('expenseSectionTitle').classList.toggle('hidden', filteredExpenses.length === 0);
            document.getElementById('emptyState').classList.toggle('hidden', filteredExpenses.length > 0);

            renderTrips(filteredTrips);
            renderExpenses(filteredExpenses);
        }

        function renderTrips(filteredTrips) {
            const container = document.getElementById('tripList');

            if (filteredTrips.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = filteredTrips.map(trip => {
                const total = trip.expenses.reduce((sum, e) => sum + e.amount, 0);

                return `
                    <div class="trip-card">
                        <div class="trip-header">
                            <div class="trip-date">${trip.date}</div>
                            <div class="trip-location">${locationEmoji[trip.location] || '📍'} ${trip.location}</div>
                        </div>
                        <div class="trip-title">${trip.name}</div>
                        <div class="trip-expenses">
                            ${trip.expenses.slice(0, 4).map(exp => `
                                <div class="expense-tag">
                                    <span>${exp.icon}</span>
                                    <span class="amount">−$${exp.amount.toFixed(0)}</span>
                                </div>
                            `).join('')}
                            ${trip.expenses.length > 4 ? `<div class="expense-tag">+${trip.expenses.length - 4}項</div>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderExpenses(expenses) {
            const container = document.getElementById('allExpensesList');
            const iconMap = {
                '交通': '🚌',
                '餐飲': '🍽️',
                '休閒': '💆',
                '收藏': '🎴',
                '購物': '🛍️'
            };

            if (expenses.length === 0) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = expenses.map(exp => `
                <div class="expense-item">
                    <div class="expense-left">
                        <div class="expense-icon">${iconMap[exp.category] || '💰'}</div>
                        <div class="expense-info">
                            <div class="name">${exp.name}</div>
                            <div class="trip-name">${locationEmoji[exp.tripLocation] || '📍'} ${exp.tripName} · ${exp.time}</div>
                        </div>
                    </div>
                    <div class="expense-amount">−$${exp.amount.toFixed(2)}</div>
                </div>
            `).join('');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderTripTabs();
            initCharts();
            initMap();
            applyFilters();
        });
    </script>
</body>
</html>
